<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>__TITLE__</title>
<script src="https://unpkg.com/@antv/g6@5.0.51/dist/g6.min.js"></script>
<style>
__STYLES__
</style>
</head>

<body>
<div id="root">
  <div id="stack">
    <div class="pane-header">
      <span class="pane-title">Runtime Stack</span>
      <button id="stackToggleBtn" class="pane-toggle" type="button">隐藏</button>
    </div>
    <div id="stackView"></div>
  </div>
  <div id="stackResizeHandle" class="pane-resizer" role="separator" aria-label="resize stack"></div>
  <div id="middle">
    <div id="graph"></div>
  </div>
  <div id="rightResizeHandle" class="pane-resizer" role="separator" aria-label="resize right"></div>
  <div id="right">
    <div class="pane-header">
      <span class="pane-title">Original Source </span>
      <button id="codeToggleBtn" class="pane-toggle" type="button">隐藏</button>
    </div>
    <div id="codeView"></div>
    <div id="controls">
      <button id="prevStepBtn">Prev</button>
      <button id="nextStepBtn">Next</button>
      <button id="stepBackBtn">Step Back</button>
      <button id="stepOverBtn">Step Over</button>
      <button id="stepOutBtn">Step Out</button>
      <span>
        Step
        <input id="stepInput" type="number" min="1" step="1" />
        / <span id="stepTotal">0</span>
        &nbsp;|&nbsp; line <span id="lineInfo">-</span>
      </span>
      <span>
        Run to line
        <input id="runLineInput" type="number" min="1" step="1" />
        <button id="runToLineBtn">Go</button>
      </span>
      <button id="hiddenNodesBtn" class="icon-btn" type="button" title="隐藏节点列表">👁</button>
      <button id="settingsBtn" class="icon-btn" type="button" title="样式设置">⚙</button>
      <span id="breakpointInfo">breakpoints: click line numbers, forward navigation stops on hits</span>
      <label id="autoFitWrap">
        <input id="autoFitToggle" type="checkbox" checked />
        自动缩放
      </label>
    </div>
    <div id="hiddenNodesPanel">
      <div class="pane-header">
        <span class="pane-title">隐藏节点</span>
        <button id="hiddenNodesCloseBtn" class="pane-toggle" type="button">关闭</button>
      </div>
      <div id="hiddenNodesList"></div>
    </div>
    <div id="settingsPanel">
      <div class="pane-header">
        <span class="pane-title">样式设置</span>
        <button id="settingsCloseBtn" class="pane-toggle" type="button">关闭</button>
      </div>
      <div id="settingsBody">
        <label class="settings-row">
          <span>文本方向</span>
          <select id="settingsTextFlow">
            <option value="horizontal">横向</option>
            <option value="vertical">纵向</option>
          </select>
        </label>
        <div class="settings-actions">
          <button id="settingsApplyBtn" type="button">Apply</button>
        </div>
      </div>
    </div>
  </div>
  <button id="stackRestoreBtn" class="edge-toggle edge-toggle-left" type="button" title="显示左侧栈面板" aria-label="显示左侧栈面板"></button>
  <button id="rightRestoreBtn" class="edge-toggle edge-toggle-right" type="button" title="显示右侧代码面板" aria-label="显示右侧代码面板"></button>
</div>

<script>
const STEPS = __STEPS__;
const DISPLAY_INDICES = __DISPLAY_INDICES__;
const SOURCE_LINES = __SOURCE_LINES__;
const baseLayout = __LAYOUT__;
const STEP_DIFFS = [];
const STACK_UI_STATE = {
  nameExpanded: new Map(),
  valueExpanded: new Map(),
  treeExpanded: new Map(),
};
let current = 0;
let currentRaw = null;  // non-null when stepping through execution events (raw STEPS index)
let graph = null;
let codeRows = [];
let graphResizeObserver = null;
let hoveredLine = null;
let hoveredFrameKey = null;
let selectedFrameKey = null;
const BREAKPOINTS = new Set();
const BREAKPOINTS_ENABLED = __BREAKPOINTS_ENABLED__;
const HIDDEN_NODES = new Map();  // Map<nodeId, label> — hidden nodes
let hiddenPanelVisible = false;

// ── Visualisation configuration ──
const VIS_CONFIG_STORAGE_KEY = 'dsvis:config';
const DEFAULT_VIS_CONFIG = {
  textFlow: 'horizontal',
  showSubtitle: true,
};

function loadVisConfig() {
  try {
    const raw = localStorage.getItem(VIS_CONFIG_STORAGE_KEY);
    if (!raw) return { ...DEFAULT_VIS_CONFIG };
    const parsed = JSON.parse(raw);
    // Merge: only accept known keys, fall back to defaults for missing/invalid
    const merged = { ...DEFAULT_VIS_CONFIG };
    for (const key of Object.keys(DEFAULT_VIS_CONFIG)) {
      if (key in parsed && typeof parsed[key] === typeof DEFAULT_VIS_CONFIG[key]) {
        merged[key] = parsed[key];
      }
    }
    return merged;
  } catch (_) {
    return { ...DEFAULT_VIS_CONFIG };
  }
}

function saveVisConfig(config) {
  try {
    localStorage.setItem(VIS_CONFIG_STORAGE_KEY, JSON.stringify(config));
  } catch (_) { /* storage unavailable — silently ignore */ }
}

/** Apply VIS_CONFIG changes and re-render. Usable from devtools:
 *  > VIS_CONFIG.textFlow = 'vertical'; applyVisConfig();
 */
function applyVisConfig() {
  saveVisConfig(VIS_CONFIG);
  if (currentRaw != null) {
    renderStepRaw(currentRaw);
  } else {
    renderStep(current);
  }
}

const VIS_CONFIG = loadVisConfig();
const LAYOUT_PRESET = {
  minNodeWidth: 120,
  minNodeHeight: 60,
  minGapX: 28,
  minGapY: 22,
  gapRatioX: 0.24,
  gapRatioY: 0.22,
  dagreExtraX: 24,
  dagreExtraY: 18,
  gridPadding: 14,
  treeConnectivityThreshold: 0.55,
  aspectMin: 0.6,
  aspectMax: 1.8,
};
const FIT_PADDING = { top: 44, right: 30, bottom: 44, left: 30 };
const AUTO_FIT_CONFIG = {
  maxScale: 1.25,
  innerRingRatio: 0.08,
  minInnerRingPx: 18,
};
const ANIMATION_CONFIG = {
  // Lower this further (e.g. 80) for faster fade in/out.
  durationMs: 120,
  easing: 'linear',
};
const PANEL_STATE = {
  stackVisible: false,
  codeVisible: false,
};
const RESIZE_CONFIG = {
  stack: { min: 220, max: 560, collapsed: 56 },
  right: { min: 220, collapsed: 56 },
  middleMin: 260,
};
const EDGE_HIDE_CONFIG = {
  hideThresholdPx: 24,
  nearEdgeGlowPx: 40,
};
const DELTA_COLORS = {
  unchanged: { fill: '#e8f0fe', stroke: '#5b8ff9', line: '#333' },
  changed: { fill: '#fff5e6', stroke: '#ff9800', line: '#c97200' },
  added: { fill: '#eafaf0', stroke: '#34a853', line: '#1e8e3e' },
};

// Map display index → real step index
function toReal(di) {
  const i = Math.max(0, Math.min(di, DISPLAY_INDICES.length - 1));
  return DISPLAY_INDICES[i];
}

// Total visible steps
function totalSteps() { return DISPLAY_INDICES.length; }

function getStepFrames(displayIndex) {
  const ri = toReal(displayIndex);
  const frames = STEPS[ri]?.stack?.frames;
  return Array.isArray(frames) ? frames : [];
}

function getDeepestFrame(displayIndex) {
  const frames = getStepFrames(displayIndex);
  return frames.length ? frames[frames.length - 1] : null;
}

function frameKey(frame, frameIndex) {
  return [frame?.filename || '', frame?.name || '', String(frameIndex ?? '')].join('|');
}

function getCurrentLine(stepIndex = current) {
  const raw = currentRaw ?? toReal(stepIndex);
  const step = STEPS[raw];
  const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
  const deepest = frames.length ? frames[frames.length - 1] : null;
  const frameLine = Number(deepest?.lineno);
  if (Number.isFinite(frameLine) && frameLine > 0) return frameLine;
  const stepLine = Number(step?.lineno);
  return Number.isFinite(stepLine) && stepLine > 0 ? stepLine : 1;
}

function getFocusedLine(stepIndex = current) {
  const raw = currentRaw ?? toReal(stepIndex);
  const step = STEPS[raw];
  const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
  if (selectedFrameKey && frames.length) {
    for (let i = 0; i < frames.length; i++) {
      if (frameKey(frames[i], i) === selectedFrameKey) {
        const selectedLine = Number(frames[i]?.lineno);
        if (Number.isFinite(selectedLine) && selectedLine > 0) return selectedLine;
        break;
      }
    }
  }
  return getCurrentLine(stepIndex);
}

function getCurrentFrameKey(stepIndex = current) {
  const raw = currentRaw ?? toReal(stepIndex);
  const step = STEPS[raw];
  const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
  const deepestIndex = frames.length - 1;
  const fallbackKey = deepestIndex >= 0 ? frameKey(frames[deepestIndex], deepestIndex) : null;
  if (!selectedFrameKey) {
    return fallbackKey;
  }
  for (let i = 0; i < frames.length; i++) {
    if (frameKey(frames[i], i) === selectedFrameKey) {
      return selectedFrameKey;
    }
  }
  return fallbackKey;
}

function setHoveredLine(lineno, frameKeyValue = null) {
  hoveredLine = Number.isFinite(Number(lineno)) ? Number(lineno) : null;
  hoveredFrameKey = frameKeyValue;
  syncCodeHighlights(false);
  syncStackHighlights();
}

function clearHoveredLine() {
  hoveredLine = null;
  hoveredFrameKey = null;
  syncCodeHighlights(false);
  syncStackHighlights();
}

function toggleBreakpoint(lineno) {
  if (!BREAKPOINTS_ENABLED) return;
  const line = Number(lineno);
  if (!Number.isFinite(line) || line <= 0) return;
  if (BREAKPOINTS.has(line)) {
    BREAKPOINTS.delete(line);
  } else {
    BREAKPOINTS.add(line);
  }
  syncCodeHighlights(false);
}

function stepHasBreakpoint(step) {
  const line = Number(step?.lineno);
  if (Number.isFinite(line) && BREAKPOINTS.has(line)) return true;
  const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
  return frames.some((frame) => {
    const frameLine = Number(frame?.lineno);
    return Number.isFinite(frameLine) && BREAKPOINTS.has(frameLine);
  });
}

function findNextBreakpointStep(startDisplayIndex = current + 1) {
  const fromReal = toReal(startDisplayIndex);
  for (let i = fromReal + 1; i < STEPS.length; i++) {
    if (stepHasBreakpoint(STEPS[i])) {
      // Map back to display index (find closest display index <= real index)
      for (let d = startDisplayIndex; d < DISPLAY_INDICES.length; d++) {
        if (DISPLAY_INDICES[d] >= i) return d;
      }
      return DISPLAY_INDICES.length - 1;
    }
  }
  return -1;
}

function advanceStep(targetDisplayIndex) {
  if (!DISPLAY_INDICES.length) return;
  const target = Math.max(0, Math.min(targetDisplayIndex, DISPLAY_INDICES.length - 1));
  if (target <= current) {
    renderStep(target);
    return;
  }
  const bpIdx = findNextBreakpointStep(current + 1);
  renderStep(bpIdx >= 0 ? bpIdx : target);
}

function syncCodeHighlights(scrollToCurrent = false) {
  const currentLine = getCurrentLine();
  const focusedLine = getFocusedLine();
  codeRows.forEach((row, idx) => {
    const lineNo = idx + 1;
    row.classList.toggle('current', lineNo === currentLine);
    row.classList.toggle('hover', hoveredLine !== null && lineNo === hoveredLine);
    row.classList.toggle('breakpoint', BREAKPOINTS.has(lineNo));
    row.classList.toggle('active', lineNo === focusedLine && lineNo !== currentLine);
    const bp = row.querySelector('.ln-breakpoint');
    if (bp) bp.classList.toggle('on', BREAKPOINTS.has(lineNo));
    const arrow = row.querySelector('.ln-arrow');
    if (arrow) { arrow.textContent = lineNo === currentLine ? '\u279c' : ''; }
  });
  const scrollLine = focusedLine || currentLine;
  if (scrollToCurrent && codeRows[scrollLine - 1]) {
    codeRows[scrollLine - 1].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const stepInput = document.getElementById('stepInput');
  const stepTotal = document.getElementById('stepTotal');
  const lineInfo = document.getElementById('lineInfo');
  if (currentRaw != null) {
    // In raw stepping mode — show line number, not step index
    if (stepInput) stepInput.value = '';
    if (stepTotal) stepTotal.textContent = `line ${currentLine}`;
  } else {
    if (stepInput) stepInput.value = String(current + 1);
    if (stepTotal) stepTotal.textContent = String(totalSteps());
  }
  if (lineInfo) lineInfo.textContent = String(currentLine);
}

function syncStackHighlights() {
  const stackView = document.getElementById('stackView');
  if (!stackView) return;
  const cards = stackView.querySelectorAll('.stack-card.interactive');
  cards.forEach((card) => {
    const frameKeyValue = card.getAttribute('data-frame-key') || '';
    card.classList.toggle('current-frame', Boolean(frameKeyValue) && frameKeyValue === getCurrentFrameKey());
    card.classList.toggle('hover-frame', Boolean(frameKeyValue) && frameKeyValue === hoveredFrameKey);
  });
}

// Map a real STEPS index back to the nearest display index
function toDisplay(realIdx) {
  for (let d = 0; d < DISPLAY_INDICES.length; d++) {
    if (DISPLAY_INDICES[d] >= realIdx) return d;
  }
  return DISPLAY_INDICES.length - 1;
}

function findStepIndex(predicate, startDisplayIndex = current + 1) {
  const startReal = toReal(startDisplayIndex) + 1;
  for (let i = startReal; i < STEPS.length; i++) {
    if (predicate(STEPS[i], i)) return toDisplay(i);
  }
  return current;
}

function findStepIndexReverse(predicate, startDisplayIndex = current - 1) {
  const startReal = toReal(startDisplayIndex);
  for (let i = startReal; i >= 0; i--) {
    if (predicate(STEPS[i], i)) return toDisplay(i);
  }
  return current;
}

// ── Raw-index search functions (return STEPS index, not display index) ──

function findStepRaw(predicate, startRaw) {
  for (let i = startRaw; i < STEPS.length; i++) {
    if (predicate(STEPS[i], i)) return i;
  }
  return -1;
}

function findStepRawReverse(predicate, startRaw) {
  for (let i = startRaw; i >= 0; i--) {
    if (predicate(STEPS[i], i)) return i;
  }
  return -1;
}

function findStepOverRaw() {
  const raw = currentRaw ?? toReal(current);
  const frames = getStepFramesRaw(raw);
  const currentDepth = frames.length;
  const deepest = frames.length ? frames[frames.length - 1] : null;
  const currentFrameKey = deepest ? frameKey(deepest, currentDepth - 1) : null;
  const currentLine = Number(deepest?.lineno) || (STEPS[raw]?.lineno ?? 0);

  return findStepRaw((step) => {
    const fs = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    if (fs.length > currentDepth) return false;
    const d = fs.length ? fs[fs.length - 1] : null;
    if (!d) return true;
    const nk = frameKey(d, fs.length - 1);
    if (currentFrameKey && nk === currentFrameKey && Number(d?.lineno) === currentLine) return false;
    return true;
  }, raw + 1);
}

function findStepOutRaw() {
  const raw = currentRaw ?? toReal(current);
  const currentDepth = (Array.isArray(STEPS[raw]?.stack?.frames) ? STEPS[raw].stack.frames : []).length;
  return findStepRaw((step) => {
    const fs = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    return fs.length < currentDepth;
  }, raw + 1);
}

function findStepBackRaw() {
  const raw = currentRaw ?? toReal(current);
  const frames = getStepFramesRaw(raw);
  const currentDepth = frames.length;
  const deepest = frames.length ? frames[frames.length - 1] : null;
  const currentFrameKey = deepest ? frameKey(deepest, currentDepth - 1) : null;
  const currentLine = Number(deepest?.lineno) || (STEPS[raw]?.lineno ?? 0);

  return findStepRawReverse((step) => {
    const fs = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    if (fs.length > currentDepth) return false;
    const d = fs.length ? fs[fs.length - 1] : null;
    if (!d) return true;
    const nk = frameKey(d, fs.length - 1);
    if (currentFrameKey && nk === currentFrameKey && Number(d?.lineno) === currentLine) return false;
    return true;
  }, raw - 1);
}

// Helper: get frames from a raw STEPS index
function getStepFramesRaw(ri) {
  const frames = STEPS[ri]?.stack?.frames;
  return Array.isArray(frames) ? frames : [];
}

function findNextLineStep(targetLine, startDisplayIndex = current + 1) {
  const line = Number(targetLine);
  if (!Number.isFinite(line) || line <= 0) return current;
  const startReal = toReal(startDisplayIndex) + 1;
  for (let i = startReal; i < STEPS.length; i++) {
    const step = STEPS[i];
    if (Number(step?.lineno) === line) return toDisplay(i);
    const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    if (frames.some((frame) => Number(frame?.lineno) === line)) return toDisplay(i);
  }
  return current;
}

function findStepOverIndex(startIndex = current + 1) {
  const currentFrames = getStepFrames(current);
  const currentDepth = currentFrames.length;
  const currentFrame = getDeepestFrame(current);
  const currentFrameKey = currentFrame ? frameKey(currentFrame, currentDepth - 1) : null;
  const currentLine = Number(currentFrame?.lineno) || getCurrentLine();

  return findStepIndex((step) => {
    const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    if (frames.length > currentDepth) return false;
    const deepest = frames.length ? frames[frames.length - 1] : null;
    if (!deepest) return true;
    const nextKey = frameKey(deepest, frames.length - 1);
    if (currentFrameKey && nextKey === currentFrameKey && Number(deepest?.lineno) === currentLine) {
      return false;
    }
    return true;
  }, startIndex);
}

function findStepOutIndex(startIndex = current + 1) {
  const currentDepth = getStepFrames(current).length;
  return findStepIndex((step) => {
    const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    return frames.length < currentDepth;
  }, startIndex);
}

function findStepBackIndex(startIndex = current - 1) {
  const currentFrames = getStepFrames(current);
  const currentDepth = currentFrames.length;
  const currentFrame = getDeepestFrame(current);
  const currentFrameKey = currentFrame ? frameKey(currentFrame, currentDepth - 1) : null;
  const currentLine = Number(currentFrame?.lineno) || getCurrentLine();

  return findStepIndexReverse((step) => {
    const frames = Array.isArray(step?.stack?.frames) ? step.stack.frames : [];
    if (frames.length > currentDepth) return false;
    const deepest = frames.length ? frames[frames.length - 1] : null;
    if (!deepest) return true;
    const nextKey = frameKey(deepest, frames.length - 1);
    if (currentFrameKey && nextKey === currentFrameKey && Number(deepest?.lineno) === currentLine) {
      return false;
    }
    return true;
  }, startIndex);
}

// Raw step jump — no breakpoint check, no line semantics
function jumpToStep(targetDisplayIndex) {
  if (!DISPLAY_INDICES.length) return;
  const target = Math.max(0, Math.min(targetDisplayIndex, DISPLAY_INDICES.length - 1));
  renderStep(target);
}

function findFrameStepIndex(frameKeyValue, preferredIndex = current) {
  if (!frameKeyValue) return preferredIndex;
  for (let i = preferredIndex; i < STEPS.length; i++) {
    const frames = Array.isArray(STEPS[i]?.stack?.frames) ? STEPS[i].stack.frames : [];
    if (frames.some((frame, idx) => frameKey(frame, idx) === frameKeyValue)) {
      return i;
    }
  }
  for (let i = preferredIndex - 1; i >= 0; i--) {
    const frames = Array.isArray(STEPS[i]?.stack?.frames) ? STEPS[i].stack.frames : [];
    if (frames.some((frame, idx) => frameKey(frame, idx) === frameKeyValue)) {
      return i;
    }
  }
  return preferredIndex;
}

function analyzeLayoutMetrics(graphData, viewport) {
  const nodes = Array.isArray(graphData?.nodes) ? graphData.nodes : [];
  const edges = Array.isArray(graphData?.edges) ? graphData.edges : [];
  let maxH = 80;
  let maxW = 160;
  let sumH = 0;
  let sumW = 0;
  for (const n of nodes) {
    const size = n?.style?.size;
    if (Array.isArray(size) && size.length >= 2) {
      const width = Number(size[0]) || 0;
      const height = Number(size[1]) || 0;
      maxW = Math.max(maxW, width);
      maxH = Math.max(maxH, height);
      sumW += width;
      sumH += height;
    }
  }

  const avgW = Math.max(LAYOUT_PRESET.minNodeWidth, Math.ceil(sumW / Math.max(nodes.length, 1)));
  const avgH = Math.max(LAYOUT_PRESET.minNodeHeight, Math.ceil(sumH / Math.max(nodes.length, 1)));
  const boundaryGapX = Math.max(LAYOUT_PRESET.minGapX, Math.ceil(avgW * LAYOUT_PRESET.gapRatioX));
  const boundaryGapY = Math.max(LAYOUT_PRESET.minGapY, Math.ceil(avgH * LAYOUT_PRESET.gapRatioY));
  const width = viewport?.width || window.innerWidth || 1200;
  const height = viewport?.height || window.innerHeight || 800;
  const aspect = Math.max(
    LAYOUT_PRESET.aspectMin,
    Math.min(LAYOUT_PRESET.aspectMax, width / Math.max(height, 1))
  );
  const cols = Math.max(1, Math.ceil(Math.sqrt(nodes.length * aspect)));
  const connectedNodeIds = new Set();
  for (const e of edges) {
    if (e?.source !== undefined) connectedNodeIds.add(String(e.source));
    if (e?.target !== undefined) connectedNodeIds.add(String(e.target));
  }
  const connectedRatio = connectedNodeIds.size / Math.max(nodes.length, 1);
  const treeLike = edges.length > 0 && (
    connectedRatio >= LAYOUT_PRESET.treeConnectivityThreshold ||
    edges.length >= nodes.length - 1
  );

  return { nodes, maxW, maxH, cols, boundaryGapX, boundaryGapY, treeLike };
}

function computeAdaptiveLayout(graphData, viewport = null) {
  const metrics = analyzeLayoutMetrics(graphData, viewport);
  const rankdir = VIS_CONFIG.textFlow === 'vertical' ? 'TB' : ((baseLayout && baseLayout.rankdir) ? baseLayout.rankdir : 'LR');
  
  if (!metrics.nodes.length) {
    return {
      type: 'dagre',
      rankdir: rankdir,
      nodesep: rankdir === 'TB' ? 110 : 80,
      ranksep: rankdir === 'TB' ? 110 : 110,
    };
  }

  if (metrics.treeLike) {
    return {
      type: 'dagre',
      rankdir: rankdir,
      nodesep: rankdir === 'TB' 
        ? Math.max(metrics.boundaryGapX + LAYOUT_PRESET.dagreExtraX, 44)
        : Math.max(metrics.boundaryGapY + LAYOUT_PRESET.dagreExtraY, 44),
      ranksep: rankdir === 'TB'
        ? Math.max(metrics.boundaryGapY + LAYOUT_PRESET.dagreExtraY, 68)
        : Math.max(metrics.boundaryGapX + LAYOUT_PRESET.dagreExtraX, 68),
    };
  }

  return {
    type: 'grid',
    cols: metrics.cols,
    preventOverlap: true,
    nodeSize: [metrics.maxW, metrics.maxH],
    preventOverlapPadding: Math.max(metrics.boundaryGapX, metrics.boundaryGapY),
    sortBy: 'id',
    padding: [LAYOUT_PRESET.gridPadding, LAYOUT_PRESET.gridPadding, LAYOUT_PRESET.gridPadding, LAYOUT_PRESET.gridPadding],
  };
}


function applyCompactGridLayout(graphData, viewport = null) {
  const metrics = analyzeLayoutMetrics(graphData, viewport || getGraphSize());
  const workingData = JSON.parse(JSON.stringify(graphData || { nodes: [], edges: [] }));
  const nodes = Array.isArray(workingData.nodes) ? workingData.nodes.slice() : [];
  const cols = Math.max(1, metrics.cols);
  const stepX = Math.max(metrics.maxW + metrics.boundaryGapX, 96);
  const stepY = Math.max(metrics.maxH + metrics.boundaryGapY, 72);
  const totalRows = Math.max(1, Math.ceil(nodes.length / cols));
  const totalW = Math.max(0, (cols - 1) * stepX);
  const totalH = Math.max(0, (totalRows - 1) * stepY);
  const startX = -Math.floor(totalW / 2);
  const startY = -Math.floor(totalH / 2);

  nodes.sort((a, b) => String(a?.id ?? '').localeCompare(String(b?.id ?? '')));
  nodes.forEach((node, idx) => {
    const row = Math.floor(idx / cols);
    const col = idx % cols;
    node.style = node.style || {};
    node.style.x = startX + col * stepX;
    node.style.y = startY + row * stepY;
  });

  return {
    data: workingData,
    layout: { type: 'preset' },
  };
}

function normalizeLayoutType(layoutTypeRaw) {
  const t = String(layoutTypeRaw || '').trim().toLowerCase();
  if (!t || t === 'default' || t === 'dagre') return 'default';
  if (t === 'concentriclayout' || t === 'concentric') return 'concentric';
  if (t === 'snakelayout' || t === 'snake') return 'snake';
  return 'default';
}

function buildUndirectedAdj(graphData) {
  const nodeIds = Array.isArray(graphData?.nodes) ? graphData.nodes.map((n) => String(n.id)) : [];
  const adj = new Map(nodeIds.map((id) => [id, new Set()]));
  const edges = Array.isArray(graphData?.edges) ? graphData.edges : [];
  for (const e of edges) {
    const s = String(e?.source ?? '');
    const t = String(e?.target ?? '');
    if (!adj.has(s) || !adj.has(t) || s === t) continue;
    adj.get(s).add(t);
    adj.get(t).add(s);
  }
  return adj;
}

function getConnectedComponents(graphData) {
  const adj = buildUndirectedAdj(graphData);
  const seen = new Set();
  const components = [];
  for (const id of adj.keys()) {
    if (seen.has(id)) continue;
    const queue = [id];
    seen.add(id);
    const comp = [];
    while (queue.length) {
      const cur = queue.shift();
      comp.push(cur);
      for (const nxt of adj.get(cur) || []) {
        if (seen.has(nxt)) continue;
        seen.add(nxt);
        queue.push(nxt);
      }
    }
    components.push(comp.sort());
  }
  components.sort((a, b) => b.length - a.length);
  return components;
}

function arrangeSnake(componentIds, originX, originY, gapX, gapY) {
  const out = new Map();
  const cols = Math.max(1, Math.ceil(Math.sqrt(componentIds.length)));
  for (let i = 0; i < componentIds.length; i++) {
    const row = Math.floor(i / cols);
    const col = i % cols;
    const snakeCol = row % 2 === 0 ? col : (cols - 1 - col);
    out.set(componentIds[i], { x: originX + snakeCol * gapX, y: originY + row * gapY });
  }
  return out;
}

function arrangeConcentric(componentIds, adj, originX, originY, ringStep) {
  const out = new Map();
  if (!componentIds.length) return out;
  const center = componentIds.slice().sort((a, b) => (adj.get(b)?.size || 0) - (adj.get(a)?.size || 0))[0];
  const levelByNode = new Map([[center, 0]]);
  const queue = [center];
  while (queue.length) {
    const cur = queue.shift();
    const level = levelByNode.get(cur);
    for (const nxt of (adj.get(cur) || [])) {
      if (levelByNode.has(nxt)) continue;
      levelByNode.set(nxt, level + 1);
      queue.push(nxt);
    }
  }

  const levels = new Map();
  for (const id of componentIds) {
    const lv = levelByNode.get(id);
    const key = Number.isFinite(lv) ? lv : Number.MAX_SAFE_INTEGER;
    if (!levels.has(key)) levels.set(key, []);
    levels.get(key).push(id);
  }

  for (const [lv, ids] of levels.entries()) {
    ids.sort();
    if (lv === 0) {
      out.set(ids[0], { x: originX, y: originY });
      continue;
    }
    if (!Number.isFinite(lv) || lv >= Number.MAX_SAFE_INTEGER) {
      const loose = arrangeSnake(ids, originX - ringStep, originY + ringStep, ringStep, Math.max(56, Math.floor(ringStep * 0.6)));
      for (const [id, pos] of loose.entries()) out.set(id, pos);
      continue;
    }
    const radius = ringStep * lv;
    for (let i = 0; i < ids.length; i++) {
      const theta = (Math.PI * 2 * i) / Math.max(1, ids.length);
      out.set(ids[i], { x: originX + radius * Math.cos(theta), y: originY + radius * Math.sin(theta) });
    }
  }
  return out;
}

function applyPresetLayout(graphData, presetType, viewport = null) {
  const metrics = analyzeLayoutMetrics(graphData, viewport || getGraphSize());
  const workingData = JSON.parse(JSON.stringify(graphData || { nodes: [], edges: [] }));
  const nodeMap = new Map((workingData.nodes || []).map((n) => [String(n.id), n]));
  const components = getConnectedComponents(workingData);
  const compCols = Math.max(1, Math.ceil(Math.sqrt(Math.max(components.length, 1))));
  const blockW = Math.max(metrics.maxW * 3.4, 360);
  const blockH = Math.max(metrics.maxH * 3.2, 280);
  const adj = buildUndirectedAdj(workingData);

  components.forEach((comp, idx) => {
    const row = Math.floor(idx / compCols);
    const col = idx % compCols;
    const originX = col * blockW;
    const originY = row * blockH;
    const local = presetType === 'snake'
      ? arrangeSnake(comp, originX, originY, Math.max(metrics.maxW + metrics.boundaryGapX, 120), Math.max(metrics.maxH + metrics.boundaryGapY, 88))
      : arrangeConcentric(comp, adj, originX, originY, Math.max(metrics.maxW + metrics.boundaryGapX, 110));
    for (const [id, pos] of local.entries()) {
      const node = nodeMap.get(String(id));
      if (!node) continue;
      node.style = node.style || {};
      node.style.x = pos.x;
      node.style.y = pos.y;
    }
  });

  return { data: workingData, layout: { type: 'preset' } };
}

function prepareGraphForLayout(graphData, viewport = null) {
  const metrics = analyzeLayoutMetrics(graphData, viewport || getGraphSize());
  if (!metrics.treeLike) {
    return applyCompactGridLayout(graphData, viewport || getGraphSize());
  }
  return {
    data: graphData,
    layout: computeAdaptiveLayout(graphData, viewport),
  };
}

function getGraphSize() {
  const el = document.getElementById('graph');
  return {
    width: Math.max(200, el.clientWidth),
    height: Math.max(200, el.clientHeight),
  };
}

function initGraph(data) {
  const { register, BaseNode } = G6;

  class CardNode extends BaseNode {
    drawKeyShape(attributes, container) {
      const rankdir = VIS_CONFIG.textFlow === 'vertical' ? 'TB' : ((baseLayout && baseLayout.rankdir) ? baseLayout.rankdir : 'LR');
      
      const name = attributes.name || '';
      const rows = Array.isArray(attributes.rows) ? attributes.rows : [];
      const rowBindGroups = Array.isArray(attributes.rowBindGroups) ? attributes.rowBindGroups : [];
      const rowBindBlocks = Array.isArray(attributes.rowBindBlocks) ? attributes.rowBindBlocks : [];
      const [w, h] = attributes.size || [160, 80];
      const paddingX = 10;
      const paddingY = 8;
      const rowH = 18;
      const headerH = attributes.headerHeight || 22;
      const headerLines = String(name).split('\n');

      // ── text-flow dispatch (must be early — used by debug logs + subtitle) ──
      const textFlow = attributes.textFlow || VIS_CONFIG.textFlow;
      const showSubtitle = VIS_CONFIG.showSubtitle && attributes.showSubtitle;

      const key = this.upsert('key', 'rect', {
        x: -w/2, y: -h/2, width:w, height:h, radius:4,
        fill: attributes.fill || DELTA_COLORS.unchanged.fill,
        stroke: attributes.stroke || DELTA_COLORS.unchanged.stroke,
        lineWidth: attributes.lineWidth || 1,
        zIndex: -1
      }, container);
      // [DEBUG-vflow] — log keyShape bbox
      if (textFlow === 'vertical' && !this.__vkeyShown) {
        this.__vkeyShown = true;
        console.log('[DEBUG-vflow] keyShape bbox',
          'x:', -w/2, 'y:', -h/2, 'w:', w, 'h:', h,
          'cardW:', w, 'cardH:', h,
          'textFlow:', textFlow, 'name:', String(name).substring(0,30));
      }
      const prevHeaderLineCount = this.__prevHeaderLineCount || 0;
      const subtitleText = attributes.subtitle || '';
      if (textFlow !== 'vertical') {
        headerLines.forEach((line, i) => {
          this.upsert(`title-${i}`, 'text', {
            x: -w/2 + paddingX, y: -h/2 + paddingY + 2 + i * 14, text:line,
            fontSize:12, fill:'#111', textBaseline:'top'
          }, container);
        });
        for (let i = headerLines.length; i < prevHeaderLineCount; i++) {
          this.upsert(`title-${i}`, 'text', {
            x: -w/2 + paddingX, y: -h/2 + paddingY + 2 + i * 14, text:'',
            fontSize:12, fill:'#111', textBaseline:'top'
          }, container);
        }
        this.__prevHeaderLineCount = headerLines.length;

        // ── subtitle ──
        const subtitleY = -h/2 + paddingY + 2 + headerLines.length * 14;
        this.upsert('subtitle', 'text', {
          x: -w/2 + paddingX, y: subtitleY,
          text: showSubtitle ? subtitleText : '',
          fontSize: 11, fill: '#888', textBaseline: 'top'
        }, container);
      } else {
        for (let i = 0; i < prevHeaderLineCount; i++) {
          this.upsert(`title-${i}`, 'text', {
            x: -w/2 + paddingX, y: -h/2 + paddingY + 2 + i * 14, text:'',
            fontSize:12, fill:'transparent', textBaseline:'top'
          }, container);
        }
        this.__prevHeaderLineCount = 0;
        this.upsert('subtitle', 'text', {
          x: -w/2 + paddingX, y: -h/2 + paddingY + 2,
          text: '',
          fontSize: 11, fill: 'transparent', textBaseline: 'top'
        }, container);
      }

      const rowCount = rows.length;
      const bindPalette = ['#d9ecff', '#d6f5e8', '#fbe6c8', '#e6dcff', '#ffe1ea'];
      const colorForGroup = (group) => {
        const s = String(group || '');
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
        return bindPalette[h % bindPalette.length];
      };

      // ── text-flow dispatch ──

      if (textFlow === 'vertical') {
        // ── vertical grid layout ──
        const titleColW = attributes.titleColW || 80;
        const fieldColW = attributes.fieldColW || 60;
        const gridNames = Array.isArray(attributes.gridNames) ? attributes.gridNames : [];
        const gridValues = Array.isArray(attributes.gridValues) ? attributes.gridValues : [];
        const gridRefs = Array.isArray(attributes.gridRefs) ? attributes.gridRefs : [];
        const numFields = Math.max(gridNames.length, 1);
        const rowDeltaTypes = Array.isArray(attributes.rowDeltaTypes) ? attributes.rowDeltaTypes : [];

        const gridRowH = 20;
        const gridTop = -h/2 + paddingY;
        const gridLeft = -w/2 + paddingX;

        // Grid separator lines
        const nodeStroke = attributes.stroke || DELTA_COLORS.unchanged.stroke;
        // Horizontal divider between header and data rows (skip title col because it spans 2 rows)
        this.upsert('grid-hdiv', 'line', {
          x1: gridLeft + titleColW, y1: gridTop + gridRowH,
          x2: gridLeft + titleColW + numFields * fieldColW, y2: gridTop + gridRowH,
          stroke: nodeStroke, lineWidth: 0.5, zIndex: 0
        }, container);

        // Title cell (spans 2 rows)
        this.upsert('vtitle-bg', 'rect', {
          x: gridLeft, y: gridTop, width: titleColW, height: 2 * gridRowH,
          fill: '#e8f0fe', stroke: 'none', radius: 0, zIndex: -1
        }, container);
        const titleLines = String(name).split('\n');
        titleLines.forEach((line, ti) => {
          this.upsert(`vtitle-${ti}`, 'text', {
            x: gridLeft + 4, y: gridTop + gridRowH - 2 - (titleLines.length - 1 - ti) * 12,
            text: line, fontSize: 12, fill: '#0f2c63', fontWeight: 700,
            textBaseline: 'middle'
          }, container);
        });
        const prevVTitleLineCount = this.__prevVTitleLineCount || 0;
        for (let ti = titleLines.length; ti < prevVTitleLineCount; ti++) {
          this.upsert(`vtitle-${ti}`, 'text', {
            x: gridLeft + 4, y: gridTop + gridRowH / 2,
            text: '', fontSize: 12, fill: 'transparent', textBaseline: 'middle'
          }, container);
        }
        this.__prevVTitleLineCount = titleLines.length;

        // Field columns
        for (let i = 0; i < numFields; i++) {
          const colX = gridLeft + titleColW + i * fieldColW;
          const isRef = gridRefs.includes(i);

          // Vertical divider
          this.upsert(`vdiv-${i}`, 'line', {
            x1: colX, y1: gridTop,
            x2: colX, y2: gridTop + 2 * gridRowH,
            stroke: nodeStroke, lineWidth: 0.5, zIndex: 0
          }, container);

          const rowDeltaType = rowDeltaTypes[i] || null;
          const rowColor = rowDeltaType === 'added'
            ? DELTA_COLORS.added.line
            : rowDeltaType === 'changed'
              ? DELTA_COLORS.changed.line
              : (isRef ? '#c97200' : '#333');

          const bindGroup = rowBindGroups[i];
          const bindStroke = bindGroup ? nodeStroke : 'transparent';
          const bindLineWidth = bindGroup ? Math.max(0.5, (attributes.lineWidth || 1) * 0.6) : 0;
          this.upsert(`vbind-${i}`, 'rect', {
            x: colX + 1, y: gridTop + 1, width: Math.max(fieldColW - 2, 0), height: Math.max(2 * gridRowH - 2, 0),
            fill: 'transparent', stroke: bindStroke, lineWidth: bindLineWidth, radius: 2, zIndex: 0
          }, container);

          if (isRef) {
            this.upsert(`vh-bg-${i}`, 'rect', {
              x: colX, y: gridTop, width: fieldColW, height: gridRowH,
              fill: '#fff5e6', stroke: 'none', zIndex: -1
            }, container);
          } else {
            this.upsert(`vh-bg-${i}`, 'rect', {
              x: colX, y: gridTop, width: fieldColW, height: gridRowH,
              fill: 'transparent', stroke: 'none', zIndex: -1
            }, container);
          }
          this.upsert(`vh-${i}`, 'text', {
            x: colX + 3, y: gridTop + gridRowH / 2,
            text: String(gridNames[i] || ''),
            fontSize: 11, fill: rowColor,
            fontWeight: (isRef || rowDeltaType) ? 600 : 400,
            textBaseline: 'middle'
          }, container);

          // Data row cell
          const dataY = gridTop + gridRowH;
          const valText = isRef ? '' : String(gridValues[i] || '');
          this.upsert(`vd-${i}`, 'text', {
            x: colX + 3, y: dataY + gridRowH / 2,
            text: valText,
            fontSize: 11, fill: rowColor,
            fontWeight: rowDeltaType ? 600 : 400,
            textBaseline: 'middle'
          }, container);
        }

        // Cleanup old elements
        const prevFieldCount = this.__prevFieldCount || 0;
        for (let i = numFields; i < prevFieldCount; i++) {
          this.upsert(`vdiv-${i}`, 'line', {
            x1: -w/2, y1: -h/2, x2: -w/2, y2: -h/2,
            stroke: 'transparent', lineWidth: 0, zIndex: -99
          }, container);
          this.upsert(`vh-bg-${i}`, 'rect', {
            x: -w/2, y: -h/2, width: 0, height: 0,
            fill: 'transparent', stroke: 'transparent', zIndex: -99
          }, container);
          this.upsert(`vh-${i}`, 'text', {
            x: -w/2, y: -h/2, text: '', fontSize: 1, fill: 'transparent', zIndex: -99
          }, container);
          this.upsert(`vd-${i}`, 'text', {
            x: -w/2, y: -h/2, text: '', fontSize: 1, fill: 'transparent', zIndex: -99
          }, container);
          this.upsert(`vbind-${i}`, 'rect', {
            x: -w/2, y: -h/2, width: 0, height: 0,
            fill: 'transparent', stroke: 'transparent', zIndex: -99
          }, container);
        }
        this.__prevFieldCount = numFields;
        this.__prevBindRunCount = 0;
      } else {
        // clear vertical-only artifacts when switching back to horizontal mode
        this.upsert('grid-hdiv', 'line', {
          x1: -w/2, y1: -h/2, x2: -w/2, y2: -h/2,
          stroke: 'transparent', lineWidth: 0, zIndex: -99
        }, container);
        this.upsert('vtitle-bg', 'rect', {
          x: -w/2, y: -h/2, width: 0, height: 0,
          fill: 'transparent', stroke: 'transparent', zIndex: -99
        }, container);
        const prevFieldCount = this.__prevFieldCount || 0;
        for (let i = 0; i < prevFieldCount; i++) {
          this.upsert(`vdiv-${i}`, 'line', {
            x1: -w/2, y1: -h/2, x2: -w/2, y2: -h/2,
            stroke: 'transparent', lineWidth: 0, zIndex: -99
          }, container);
          this.upsert(`vh-bg-${i}`, 'rect', {
            x: -w/2, y: -h/2, width: 0, height: 0,
            fill: 'transparent', stroke: 'transparent', zIndex: -99
          }, container);
          this.upsert(`vh-${i}`, 'text', {
            x: -w/2, y: -h/2, text: '', fontSize: 1, fill: 'transparent', zIndex: -99
          }, container);
          this.upsert(`vd-${i}`, 'text', {
            x: -w/2, y: -h/2, text: '', fontSize: 1, fill: 'transparent', zIndex: -99
          }, container);
          this.upsert(`vbind-${i}`, 'rect', {
            x: -w/2, y: -h/2, width: 0, height: 0,
            fill: 'transparent', stroke: 'transparent', zIndex: -99
          }, container);
        }
        for (let ti = 0; ti < (this.__prevVTitleLineCount || 0); ti++) {
          this.upsert(`vtitle-${ti}`, 'text', {
            x: -w/2, y: -h/2, text: '', fontSize: 1, fill: 'transparent', zIndex: -99
          }, container);
        }
        this.__prevVTitleLineCount = 0;
        this.__prevFieldCount = 0;
        const runs = [];
        let runStart = null;
        let runGroup = null;
        let runBlock = null;
        for (let i = 0; i < rowCount; i++) {
          const g = rowBindGroups[i] || null;
          const b = rowBindBlocks[i] || null;
          if (!g || !b) {
            if (runGroup !== null) {
              runs.push({ group: runGroup, block: runBlock, start: runStart, end: i - 1 });
              runStart = null;
              runGroup = null;
              runBlock = null;
            }
            continue;
          }
          if (runGroup === null || runBlock === null) {
            runGroup = g;
            runBlock = b;
            runStart = i;
            continue;
          }
          if (b !== runBlock) {
            runs.push({ group: runGroup, block: runBlock, start: runStart, end: i - 1 });
            runGroup = g;
            runBlock = b;
            runStart = i;
          }
        }
        if (runGroup !== null) {
          runs.push({ group: runGroup, block: runBlock, start: runStart, end: rowCount - 1 });
        }

        const nodeStroke = attributes.stroke || DELTA_COLORS.unchanged.stroke;
        const bindLineWidth = Math.max(0.5, (attributes.lineWidth || 1) * 0.6);

        const coveredByRun = new Set();
        runs.forEach((run, i) => {
          for (let j = run.start; j <= run.end; j++) coveredByRun.add(j);
          this.upsert(`bind-block-${i}`, 'rect', {
            x: -w/2 + 4, y: -h/2 + headerH + paddingY + run.start * rowH + 1,
            width: w - 8, height: Math.max((run.end - run.start + 1) * rowH - 2, 2), radius: 4,
            fill: 'transparent', stroke: nodeStroke, lineWidth: bindLineWidth, zIndex: 0
          }, container);
        });
        const prevRunCount = this.__prevBindRunCount || 0;
        for (let i = runs.length; i < prevRunCount; i++) {
          this.upsert(`bind-block-${i}`, 'rect', {
            x: -w/2 + 4, y: -h/2, width: 0, height: 0, radius: 0,
            fill: 'transparent', stroke: 'transparent', zIndex: 0
          }, container);
        }
        this.__prevBindRunCount = runs.length;

        rows.forEach((row, i) => {
          const bindGroup = rowBindGroups[i];
          const inRun = coveredByRun.has(i);
          this.upsert(`bind-bg-${i}`, 'rect', {
            x: -w/2 + 4, y: -h/2 + headerH + paddingY + i * rowH + 1,
            width: w - 8, height: rowH - 2, radius: 3,
            fill: 'transparent',
            stroke: (bindGroup && !inRun) ? nodeStroke : 'transparent',
            lineWidth: (bindGroup && !inRun) ? bindLineWidth : 0,
            zIndex: 0
          }, container);
          const rowDeltaType = Array.isArray(attributes.rowDeltaTypes) ? attributes.rowDeltaTypes[i] : null;
          const rowColor = rowDeltaType === 'added'
            ? DELTA_COLORS.added.line
            : rowDeltaType === 'changed'
              ? DELTA_COLORS.changed.line
              : '#333';
          this.upsert(`r-${i}`, 'text', {
            x: -w/2 + paddingX, y: -h/2 + headerH + paddingY + i * rowH + 2, text: row,
            fontSize:11, fill: rowColor, fontWeight: rowDeltaType ? 600 : 400, textBaseline:'top', zIndex: 2
          }, container);
        });

        const prevRowCount = this.__prevRowCount || 0;
        for (let i = rows.length; i < prevRowCount; i++) {
          this.upsert(`bind-bg-${i}`, 'rect', {
            x: -w/2 + 4, y: -h/2 + headerH + paddingY + i * rowH + 1,
            width: w - 8, height: rowH - 2, radius: 3,
            fill: 'transparent', stroke: 'transparent', zIndex: 0
          }, container);
          this.upsert(`r-${i}`, 'text', {
            x: -w/2 + paddingX, y: -h/2 + headerH + paddingY + i * rowH + 2, text: '',
            fontSize:11, fill:'#333', textBaseline:'top', zIndex: 2
          }, container);
        }
      }
      // ── cross-path cleanup: hide stale bind-block elements from horizontal render ──
      if (textFlow === 'vertical') {
        const prevBindRunCount = this.__prevBindRunCount || 0;
        for (let i = 0; i < prevBindRunCount; i++) {
          this.upsert(`bind-block-${i}`, 'rect', {
            x: -w/2, y: -h/2, width: 0, height: 0, radius: 0,
            fill: 'transparent', stroke: 'transparent', zIndex: -99
          }, container);
        }
      }
      this.__prevRowCount = rows.length;
      // [DEBUG-vflow] — confirm function returns
      if (textFlow === 'vertical' && !this.__vretShown) {
        this.__vretShown = true;
        console.log('[DEBUG-vflow] drawKeyShape returning key:', typeof key, 'isNull:', key === null);
      }
      return key;
    }
  }

  register('node', 'card', CardNode);
  const size = getGraphSize();
  const prepared = prepareGraphForLayout(data, size);
  graph = new G6.Graph({
    container:'graph',
    width:size.width,
    height:size.height,
    autoResize:true,
    animation: {
      duration: ANIMATION_CONFIG.durationMs,
      easing: ANIMATION_CONFIG.easing,
    },
    data: prepared.data,
    layout: prepared.layout,
    node:{
      type:'card',
      style: { port: true }
    },
    edge:{
      style:{
        endArrow:true,
        stroke:'#888',
        router: { type: 'polyline' }
      }
    },
    behaviors:['drag-canvas','zoom-canvas','drag-element']
  });

  if (typeof graph.setZoomRange === 'function') {
    graph.setZoomRange([0.05, AUTO_FIT_CONFIG.maxScale]);
  }

  graph.on('node:dragstart', onDragStart);
  graph.on('node:drag', onDragMove);
  graph.on('node:dragging', onDragMove);
  graph.on('node:dragend', onDragEnd);
  graph.on('element:dragstart', onDragStart);
  graph.on('element:drag', onDragMove);
  graph.on('element:dragend', onDragEnd);
  // Right-click on node → hide it and suppress browser context menu.
  // Right-click on empty canvas → normal browser menu (save image, etc.).
  graph.on('node:contextmenu', (evt) => {
    // Prevent the browser's native contextmenu from appearing
    const orig = evt?.originalEvent || evt?.nativeEvent || {};
    if (typeof orig.preventDefault === 'function') orig.preventDefault();
    if (typeof orig.stopPropagation === 'function') orig.stopPropagation();
    if (typeof evt.preventDefault === 'function') evt.preventDefault();
    const nodeId = evt?.target?.id || evt?.item?.id || evt?.data?.id;
    if (!nodeId) return;
    // Extract label from G6 node data
    const nd = graph?.getNodeData?.(String(nodeId));
    const label = nd?.style?.name || nd?.data?.name || String(nodeId);
    hideNode(String(nodeId), String(label));
  });

  if (typeof graph.once === 'function') {
    graph.once('afterlayout', refreshGraphVisuals);
    graph.once('afterrender', refreshGraphVisuals);
  }
  graph.render();

  if (typeof ResizeObserver !== 'undefined') {
    graphResizeObserver = new ResizeObserver(() => {
      if (!graph) return;
      const size = getGraphSize();
      if (typeof graph.setSize === 'function') {
        graph.setSize(size.width, size.height);
      }
      refreshGraphVisuals();
    });
    graphResizeObserver.observe(document.getElementById('graph'));
  }
}

function buildPortStyles(node, usedPorts) {
  const ports = Array.isArray(node?.style?.ports) ? node.style.ports : [];
  return ports.map((p) => {
    const key = p.key;
    const active = usedPorts.has(key);
    return {
      ...p,
      r: active ? 2.5 : 0,
      fill: active ? '#5b8ff9' : 'transparent',
      stroke: active ? '#2b6cd4' : 'transparent',
    };
  });
}

function resolvePortsForEdge(e, nodeMap) {
  const src = nodeMap.get(e.source);
  const tgt = nodeMap.get(e.target);
  if (!src || !tgt) return null;
  const refIndex = e.data ? e.data.refIndex : null;
  if (refIndex === null || refIndex === undefined) return null;

  // Data-driven port resolution — reads portLayout from node style
  const pl = src?.style?.portLayout;
  if (!pl || !Array.isArray(pl.entry) || !Array.isArray(pl.ref)) return null;

  const sx = src.style?.x ?? 0, tx = tgt.style?.x ?? 0;
  const sy = src.style?.y ?? 0, ty = tgt.style?.y ?? 0;
  const neg = pl.direction === 'TB' ? (ty < sy) : (tx < sx);
  const ref = pl.ref.find((r) => r.idx === refIndex);
  if (!ref || !Array.isArray(ref.ports) || ref.ports.length < 2) return null;
  return {
    sourcePort: neg ? ref.ports[1] : ref.ports[0],
    targetPort: neg ? pl.entry[1] : pl.entry[0],
  };
}

function updateEdgePorts(focusNodeId = null) {
  if (!graph) return;
  const allEdges = graph.getEdgeData();
  const nodeDataList = graph.getNodeData();
  const nodeMap = new Map(nodeDataList.map((n) => [n.id, n]));
  const relatedNodeIds = new Set();

  const edgesToUpdate = focusNodeId
    ? allEdges.filter((e) => e.source === focusNodeId || e.target === focusNodeId)
    : allEdges;

  const edgeUpdates = [];
  for (const e of edgesToUpdate) {
    const ports = resolvePortsForEdge(e, nodeMap);
    if (!ports) continue;
    edgeUpdates.push({ id: e.id, style: ports });
    relatedNodeIds.add(e.source);
    relatedNodeIds.add(e.target);
  }
  if (edgeUpdates.length > 0) {
    graph.updateEdgeData(edgeUpdates);
  }

  const nodeIdsToRefresh = focusNodeId
    ? Array.from(relatedNodeIds)
    : nodeDataList.map((n) => n.id);

  const nodeUpdates = [];
  for (const nodeId of nodeIdsToRefresh) {
    const node = nodeMap.get(nodeId);
    if (!node) continue;
    const usedPorts = new Set();
    for (const e of allEdges) {
      if (e.source !== nodeId && e.target !== nodeId) continue;
      const ports = resolvePortsForEdge(e, nodeMap);
      if (!ports) continue;
      if (e.source === nodeId) usedPorts.add(ports.sourcePort);
      if (e.target === nodeId) usedPorts.add(ports.targetPort);
    }
    nodeUpdates.push({
      id: nodeId,
      style: { ports: buildPortStyles(node, usedPorts) },
    });
  }
  if (nodeUpdates.length > 0) {
    graph.updateNodeData(nodeUpdates);
  }
  if (edgeUpdates.length > 0 || nodeUpdates.length > 0 || !focusNodeId) {
    graph.draw();
  }
}

function fitGraph() {
  requestAnimationFrame(() => {
    if (!graph) return;
    const autoFitToggle = document.getElementById('autoFitToggle');
    if (autoFitToggle && !autoFitToggle.checked) return;
    const size = getGraphSize();
    const ringInset = Math.max(
      AUTO_FIT_CONFIG.minInnerRingPx,
      Math.floor(Math.min(size.width, size.height) * AUTO_FIT_CONFIG.innerRingRatio)
    );
    const fitPadding = {
      top: FIT_PADDING.top + ringInset,
      right: FIT_PADDING.right + ringInset,
      bottom: FIT_PADDING.bottom + ringInset,
      left: FIT_PADDING.left + ringInset,
    };
    if (typeof graph.fitView === 'function') {
      graph.fitView({
        padding: [fitPadding.top, fitPadding.right, fitPadding.bottom, fitPadding.left],
        when: 'always',
        animation: false,
      });
      if (typeof graph.getZoom === 'function' && typeof graph.zoomTo === 'function') {
        const currentScale = Number(graph.getZoom());
        if (Number.isFinite(currentScale) && currentScale > AUTO_FIT_CONFIG.maxScale) {
          graph.zoomTo(AUTO_FIT_CONFIG.maxScale, { x: size.width / 2, y: size.height / 2 }, false);
        }
      }
      return;
    }
    if (typeof graph.fitCenter === 'function') {
      graph.fitCenter();
    }
  });
}

function refreshVisibleGraph() {
  if (!graph) return;

    graph.setSize(size.width, size.height);

function setStackWidthPx(nextWidth) {

    ? parseFloat(getComputedStyle(root).getPropertyValue('--right-width')) || 320

  const maxByViewport = Math.max(
    RESIZE_CONFIG.stack.min,
    rootWidth - rightWidth - RESIZE_CONFIG.middleMin - 16
  );

function bindHorizontalResizer(handleId, onMove) {
  const handle = document.getElementById(handleId);
  if (!handle) return;
  let active = false;
  let rafPending = false;
  let pendingX = 0;
  const move = (clientX) => {
    pendingX = clientX;
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      onMove(pendingX);
      refreshVisibleGraph();
    });
  };
  handle.addEventListener('pointerdown', (evt) => {
    if (handle.classList.contains('disabled')) return;
    active = true;
    document.body.classList.add('resizing');
    handle.setPointerCapture?.(evt.pointerId);
  });
  handle.addEventListener('pointermove', (evt) => {
    if (!active) return;
    move(evt.clientX);
  });
  const end = (evt) => {
    if (!active) return;
    active = false;
    document.body.classList.remove('resizing');
    if (evt && Number.isFinite(evt.clientX)) {
      move(evt.clientX);
    } else {
      refreshVisibleGraph();
    }
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

let rafId = null;
let dragging = false;
let draggingNodeId = null;

function getDragNodeId(evt) {

}

function scheduleUpdate(nodeId = null) {
  if (nodeId) draggingNodeId = nodeId;
  if (rafId !== null) return;
  rafId = requestAnimationFrame(() => {
    updateEdgePorts(draggingNodeId);
    rafId = null;

}

function onDragStart(evt) {
  const nodeId = getDragNodeId(evt);
  if (!nodeId) return;
  dragging = true;
  draggingNodeId = nodeId;

function onDragMove(evt) {

function onDragEnd(evt) {
  const nodeId = getDragNodeId(evt) || draggingNodeId;
  dragging = false;

function escapeHtml(raw) {
  return String(raw ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function highlightPythonLine(sourceLine) {
  const text = String(sourceLine ?? '');
  if (!text) return '';
  const regex = /(#[^\n]*|"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:and|as|assert|async|await|break|class|continue|def|del|elif|else|except|False|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|True|try|while|with|yield)\b|\b\d+(?:\.\d+)?\b|\bdef\s+([A-Za-z_]\w*)|\bclass\s+([A-Za-z_]\w*)|[+\-*/%=<>!]+)/g;
  let last = 0;
  let html = '';
  for (const match of text.matchAll(regex)) {
    const token = match[0];
    const index = match.index ?? 0;
    if (index > last) {
      html += escapeHtml(text.slice(last, index));
    }
    let cls = '';
    if (token.startsWith('#')) cls = 'tok-comment';
    else if (token.startsWith('"') || token.startsWith("'")) cls = 'tok-string';
    else if (/^\b\d/.test(token) || /^\d/.test(token)) cls = 'tok-number';
    else if (/^(def\s+)/.test(token)) cls = 'tok-keyword';
    else if (/^(class\s+)/.test(token)) cls = 'tok-keyword';
    else if (/^[+\-*/%=<>!]+$/.test(token)) cls = 'tok-operator';
    else cls = 'tok-keyword';
    html += `<span class="${cls}">${escapeHtml(token)}</span>`;
    last = index + token.length;
  }
  if (last < text.length) {
    html += escapeHtml(text.slice(last));
  }
  return html;
}


function parseVerticalField(rowText, isRef) {
  const raw = String(rowText || '').trim();
  if (!raw) return { name: '', value: '' };
  if (!isRef && raw.includes(' = ')) {
    const idx = raw.indexOf(' = ');
    return { name: raw.slice(0, idx).trim(), value: raw.slice(idx + 3).trim() };
  }
  for (const sep of [' -> ', ': ', '=>', '→']) {
    if (raw.includes(sep)) {
      const idx = raw.indexOf(sep);
      return {
        name: raw.slice(0, idx).trim(),
        value: isRef ? '' : raw.slice(idx + sep.length).trim(),
      };
    }
  }
  if (isRef && raw.includes(' ')) {
    return { name: raw.split(/\s+/, 1)[0], value: '' };
  }
  return { name: raw, value: isRef ? '' : raw };
}

function adaptNodesForTextFlow(graphData) {
  if (VIS_CONFIG.textFlow !== 'vertical') return graphData;
  const nodes = Array.isArray(graphData?.nodes) ? graphData.nodes : [];
  for (const n of nodes) {
    n.style = n.style || {};
    const st = n.style;
    st.textFlow = 'vertical';
    const rows = Array.isArray(st.rows) ? st.rows : [];
    const refRowSet = new Set(Array.isArray(st.refRowIndices) ? st.refRowIndices : []);
    const parsed = rows.map((r, i) => parseVerticalField(r, refRowSet.has(i)));
    st.gridNames = parsed.map((x) => x.name);
    st.gridValues = parsed.map((x) => x.value);
    st.gridRefs = parsed.map((_, i) => i).filter((i) => refRowSet.has(i));

    const title = String(st.name || '');
    const titleW = Math.max(60, Math.min(180, Math.ceil(Math.max(...title.split('\n').map((x) => x.length), 1) * 6 + 12)));
    const colW = Math.max(50, Math.min(130, Math.ceil(Math.max(1, ...parsed.map((x) => Math.max(String(x.name).length, String(x.value).length))) * 6 + 12)));
    const numFields = Math.max(1, parsed.length);
    const padX = 10, padY = 8, rowH = 20;
    st.titleColW = titleW;
    st.fieldColW = colW;
    st.size = [Math.max(120, padX * 2 + titleW + numFields * colW), padY * 2 + rowH * 2];

    // Ports should attach to cell centers (not whole-node border centers).
    // Vertical table has 2 rows and (1 + numFields) columns, where column 0 is title.
    const w = Number(st.size?.[0]) || 120;
    const h = Number(st.size?.[1]) || 56;
    const titleCenterX = (padX + titleW / 2) / Math.max(w, 1);
    const topEdgeY = 0;
    const bottomEdgeY = 1;

    st.ports = [
      { key: 'inT', placement: [titleCenterX, topEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' },
      { key: 'inB', placement: [titleCenterX, bottomEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' },
    ];
    const refEntries = [];
    st.gridRefs.forEach((rowIdx) => {
      const cellCenterX = (padX + titleW + rowIdx * colW + colW / 2) / Math.max(w, 1);
      st.ports.push({ key: `pt${rowIdx}`, placement: [cellCenterX, topEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' });
      st.ports.push({ key: `pb${rowIdx}`, placement: [cellCenterX, bottomEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' });
      refEntries.push({ idx: rowIdx, ports: [`pb${rowIdx}`, `pt${rowIdx}`] });
    });
    st.portLayout = { direction: 'TB', entry: ['inT', 'inB'], ref: refEntries };
  }
  return graphData;
}
function cloneGraphData(data) {
  return JSON.parse(JSON.stringify(data || { nodes: [], edges: [] }));
}

function edgeSignature(edge) {
  return `${edge.source}->${edge.target}#${edge?.data?.refIndex ?? 'na'}`;
}

function computeStepDiffs() {
  STEP_DIFFS.length = 0;
  let prevGraph = null;
  let prevStack = null;
  for (let stepIdx = 0; stepIdx < STEPS.length; stepIdx++) {
    const currentGraph = STEPS[stepIdx]?.graph || { nodes: [], edges: [] };
    const diff = {
      nodeTypes: new Map(),
      nodeRowTypes: new Map(),
      addedEdgeSigs: new Set(),
    };
    if (prevGraph) {
      const prevNodeMap = new Map((prevGraph.nodes || []).map((n) => [n.id, n]));
      for (const node of currentGraph.nodes || []) {
        const prevNode = prevNodeMap.get(node.id);
        const rows = Array.isArray(node?.style?.rows) ? node.style.rows : [];
        if (!prevNode) {
          diff.nodeTypes.set(node.id, 'added');
          diff.nodeRowTypes.set(node.id, rows.map(() => 'added'));
          continue;
        }
        const prevRows = Array.isArray(prevNode?.style?.rows) ? prevNode.style.rows : [];
        const rowTypes = [];
        let hasChange = false;
        const maxLen = Math.max(rows.length, prevRows.length);
        for (let i = 0; i < maxLen; i++) {
          if (i >= prevRows.length) {
            rowTypes[i] = 'added';
            hasChange = true;
          } else if (rows[i] !== prevRows[i]) {
            rowTypes[i] = 'changed';
            hasChange = true;
          } else {
            rowTypes[i] = '';
          }
        }
        if ((node?.style?.name || '') !== (prevNode?.style?.name || '')) {
          hasChange = true;
        }
        if (hasChange) {
          diff.nodeTypes.set(node.id, 'changed');
          diff.nodeRowTypes.set(node.id, rowTypes);
        }
      }

      const prevEdges = new Set((prevGraph.edges || []).map(edgeSignature));
      for (const edge of currentGraph.edges || []) {
        const sig = edgeSignature(edge);
        if (!prevEdges.has(sig)) diff.addedEdgeSigs.add(sig);
      }
    }
    // compute stack row diffs between previous step and current
    diff.stackRowTypes = new Map();
    const currentStack = STEPS[stepIdx]?.stack || { frames: [] };
    if (prevStack) {
      const prevFrames = Array.isArray(prevStack.frames) ? prevStack.frames : [];
      const currFrames = Array.isArray(currentStack.frames) ? currentStack.frames : [];
      const maxFrames = Math.max(prevFrames.length, currFrames.length);
      for (let fi = 0; fi < maxFrames; fi++) {
        const prevFrame = prevFrames[fi] || null;
        const currFrame = currFrames[fi] || null;
        const key = frameKey(currFrame || prevFrame || {}, fi);
        const currRows = Array.isArray(currFrame?.locals) ? currFrame.locals : [];
        const prevRows = Array.isArray(prevFrame?.locals) ? prevFrame.locals : [];
        const maxR = Math.max(prevRows.length, currRows.length);
        const rowTypes = [];
        for (let ri = 0; ri < maxR; ri++) {
          const pText = String(prevRows[ri]?.text ?? prevRows[ri]?.compact_text ?? prevRows[ri]?.full_text ?? '');
          const cText = String(currRows[ri]?.text ?? currRows[ri]?.compact_text ?? currRows[ri]?.full_text ?? '');
          if (ri >= prevRows.length) {
            rowTypes[ri] = 'added';
          } else if (pText !== cText) {
            rowTypes[ri] = 'changed';
          } else {
            rowTypes[ri] = '';
          }
        }
        if (rowTypes.some(Boolean)) diff.stackRowTypes.set(key, rowTypes);
      }
    }
    STEP_DIFFS.push(diff);
    prevGraph = currentGraph;
    prevStack = currentStack;
  }
}

function applyStepHighlights(graphData, stepIndex) {
  const diff = STEP_DIFFS[stepIndex];
  if (!diff) return graphData;
  for (const node of graphData.nodes || []) {
    const nodeType = diff.nodeTypes.get(node.id) || '';
    const color = nodeType === 'added'
      ? DELTA_COLORS.added
      : nodeType === 'changed'
        ? DELTA_COLORS.changed
        : DELTA_COLORS.unchanged;
    node.style = node.style || {};
    node.style.fill = color.fill;
    node.style.stroke = color.stroke;
    node.style.lineWidth = nodeType ? 2 : 1;
    node.style.rowDeltaTypes = diff.nodeRowTypes.get(node.id) || [];
  }
  for (const edge of graphData.edges || []) {
    const added = diff.addedEdgeSigs.has(edgeSignature(edge));
    edge.style = edge.style || {};
    edge.style.stroke = added ? DELTA_COLORS.added.stroke : '#888';
    edge.style.lineWidth = added ? 2 : 1;
    edge.style.endArrow = {
      ...(typeof edge.style.endArrow === 'object' ? edge.style.endArrow : {}),
      fill: added ? DELTA_COLORS.added.stroke : '#888',
    };
  }
  return graphData;
}
