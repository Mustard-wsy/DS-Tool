  fitGraph();
}

let rafId = null;
let dragging = false;
let draggingNodeId = null;

function getDragNodeId(evt) {
  return evt?.target?.id || evt?.item?.id || evt?.data?.id || evt?.id || null;
}

function scheduleUpdate(nodeId = null) {
  if (nodeId) draggingNodeId = nodeId;
  if (rafId !== null) return;
  rafId = requestAnimationFrame(() => {
    updateEdgePorts(draggingNodeId);
    rafId = null;
    if (dragging) scheduleUpdate(draggingNodeId);
  });
}

function onDragStart(evt) {
  const nodeId = getDragNodeId(evt);
  if (!nodeId) return;
  dragging = true;
  draggingNodeId = nodeId;
  scheduleUpdate(nodeId);
}

function onDragMove(evt) {
  const nodeId = getDragNodeId(evt) || draggingNodeId;
  if (!nodeId) return;
  scheduleUpdate(nodeId);
}

function onDragEnd(evt) {
  const nodeId = getDragNodeId(evt) || draggingNodeId;
  dragging = false;
  draggingNodeId = null;
  if (!nodeId) return;
  updateEdgePorts(nodeId);
}

function escapeHtml(raw) {
  return String(raw ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function highlightPythonLine(sourceLine) {
  const text = String(sourceLine ?? '');
  if (!text) return '';
  const regex = /(#[^\n]*|"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:and|as|assert|async|await|break|class|continue|def|del|elif|else|except|False|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|True|try|while|with|yield)\b|\b\d+(?:\.\d+)?\b|\bdef\s+([A-Za-z_]\w*)|\bclass\s+([A-Za-z_]\w*)|[+\-*/%=<>!]+)/g;
  let last = 0;
  let html = '';
  for (const match of text.matchAll(regex)) {
    const token = match[0];
    const index = match.index ?? 0;
    if (index > last) {
      html += escapeHtml(text.slice(last, index));
    }
    let cls = '';
    if (token.startsWith('#')) cls = 'tok-comment';
    else if (token.startsWith('"') || token.startsWith("'")) cls = 'tok-string';
    else if (/^\b\d/.test(token) || /^\d/.test(token)) cls = 'tok-number';
    else if (/^(def\s+)/.test(token)) cls = 'tok-keyword';
    else if (/^(class\s+)/.test(token)) cls = 'tok-keyword';
    else if (/^[+\-*/%=<>!]+$/.test(token)) cls = 'tok-operator';
    else cls = 'tok-keyword';
    html += `<span class="${cls}">${escapeHtml(token)}</span>`;
    last = index + token.length;
  }
  if (last < text.length) {
    html += escapeHtml(text.slice(last));
  }
  return html;
}


function parseVerticalField(rowText, isRef) {
  const raw = String(rowText || '').trim();
  if (!raw) return { name: '', value: '' };
  if (!isRef && raw.includes(' = ')) {
    const idx = raw.indexOf(' = ');
    return { name: raw.slice(0, idx).trim(), value: raw.slice(idx + 3).trim() };
  }
  for (const sep of [' -> ', ': ', '=>', '→']) {
    if (raw.includes(sep)) {
      const idx = raw.indexOf(sep);
      return {
        name: raw.slice(0, idx).trim(),
        value: isRef ? '' : raw.slice(idx + sep.length).trim(),
      };
    }
  }
  if (isRef && raw.includes(' ')) {
    return { name: raw.split(/\s+/, 1)[0], value: '' };
  }
  return { name: raw, value: isRef ? '' : raw };
}

function adaptNodesForTextFlow(graphData) {
  if (VIS_CONFIG.textFlow !== 'vertical') return graphData;
  const nodes = Array.isArray(graphData?.nodes) ? graphData.nodes : [];
  for (const n of nodes) {
    n.style = n.style || {};
    const st = n.style;
    st.textFlow = 'vertical';
    const rows = Array.isArray(st.rows) ? st.rows : [];
    const refRowSet = new Set(Array.isArray(st.refRowIndices) ? st.refRowIndices : []);
    const parsed = rows.map((r, i) => parseVerticalField(r, refRowSet.has(i)));
    st.gridNames = parsed.map((x) => x.name);
    st.gridValues = parsed.map((x) => x.value);
    st.gridRefs = parsed.map((_, i) => i).filter((i) => refRowSet.has(i));

    const title = String(st.name || '');
    const titleW = Math.max(60, Math.min(180, Math.ceil(Math.max(...title.split('\n').map((x) => x.length), 1) * 6 + 12)));
    const colW = Math.max(50, Math.min(130, Math.ceil(Math.max(1, ...parsed.map((x) => Math.max(String(x.name).length, String(x.value).length))) * 6 + 12)));
    const numFields = Math.max(1, parsed.length);
    const padX = 10, padY = 8, rowH = 20;
    st.titleColW = titleW;
    st.fieldColW = colW;
    st.size = [Math.max(120, padX * 2 + titleW + numFields * colW), padY * 2 + rowH * 2];

    // Ports should attach to cell centers (not whole-node border centers).
    // Vertical table has 2 rows and (1 + numFields) columns, where column 0 is title.
    const w = Number(st.size?.[0]) || 120;
    const h = Number(st.size?.[1]) || 56;
    const titleCenterX = (padX + titleW / 2) / Math.max(w, 1);
    const topEdgeY = 0;
    const bottomEdgeY = 1;

    st.ports = [
      { key: 'inT', placement: [titleCenterX, topEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' },
      { key: 'inB', placement: [titleCenterX, bottomEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' },
    ];
    const refEntries = [];
    st.gridRefs.forEach((rowIdx) => {
      const cellCenterX = (padX + titleW + rowIdx * colW + colW / 2) / Math.max(w, 1);
      st.ports.push({ key: `pt${rowIdx}`, placement: [cellCenterX, topEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' });
      st.ports.push({ key: `pb${rowIdx}`, placement: [cellCenterX, bottomEdgeY], r: 0, fill: 'transparent', stroke: 'transparent' });
      refEntries.push({ idx: rowIdx, ports: [`pb${rowIdx}`, `pt${rowIdx}`] });
    });
    st.portLayout = { direction: 'TB', entry: ['inT', 'inB'], ref: refEntries };
  }
  return graphData;
}
function cloneGraphData(data) {
  return JSON.parse(JSON.stringify(data || { nodes: [], edges: [] }));
}

function edgeSignature(edge) {
  return `${edge.source}->${edge.target}#${edge?.data?.refIndex ?? 'na'}`;
}

function computeStepDiffs() {
  STEP_DIFFS.length = 0;
  let prevGraph = null;
  let prevStack = null;
  for (let stepIdx = 0; stepIdx < STEPS.length; stepIdx++) {
    const currentGraph = STEPS[stepIdx]?.graph || { nodes: [], edges: [] };
    const diff = {
      nodeTypes: new Map(),
      nodeRowTypes: new Map(),
      addedEdgeSigs: new Set(),
    };
    if (prevGraph) {
      const prevNodeMap = new Map((prevGraph.nodes || []).map((n) => [n.id, n]));
      for (const node of currentGraph.nodes || []) {
        const prevNode = prevNodeMap.get(node.id);
        const rows = Array.isArray(node?.style?.rows) ? node.style.rows : [];
        if (!prevNode) {
          diff.nodeTypes.set(node.id, 'added');
          diff.nodeRowTypes.set(node.id, rows.map(() => 'added'));
          continue;
        }
        const prevRows = Array.isArray(prevNode?.style?.rows) ? prevNode.style.rows : [];
        const rowTypes = [];
        let hasChange = false;
        const maxLen = Math.max(rows.length, prevRows.length);
        for (let i = 0; i < maxLen; i++) {
          if (i >= prevRows.length) {
            rowTypes[i] = 'added';
            hasChange = true;
          } else if (rows[i] !== prevRows[i]) {
            rowTypes[i] = 'changed';
            hasChange = true;
          } else {
            rowTypes[i] = '';
          }
        }
        if ((node?.style?.name || '') !== (prevNode?.style?.name || '')) {
          hasChange = true;
        }
        if (hasChange) {
          diff.nodeTypes.set(node.id, 'changed');
          diff.nodeRowTypes.set(node.id, rowTypes);
        }
      }

      const prevEdges = new Set((prevGraph.edges || []).map(edgeSignature));
      for (const edge of currentGraph.edges || []) {
        const sig = edgeSignature(edge);
        if (!prevEdges.has(sig)) diff.addedEdgeSigs.add(sig);
      }
    }
    // compute stack row diffs between previous step and current
    diff.stackRowTypes = new Map();
    const currentStack = STEPS[stepIdx]?.stack || { frames: [] };
    if (prevStack) {
      const prevFrames = Array.isArray(prevStack.frames) ? prevStack.frames : [];
      const currFrames = Array.isArray(currentStack.frames) ? currentStack.frames : [];
      const maxFrames = Math.max(prevFrames.length, currFrames.length);
      for (let fi = 0; fi < maxFrames; fi++) {
        const prevFrame = prevFrames[fi] || null;
        const currFrame = currFrames[fi] || null;
        const key = frameKey(currFrame || prevFrame || {}, fi);
        const currRows = Array.isArray(currFrame?.locals) ? currFrame.locals : [];
        const prevRows = Array.isArray(prevFrame?.locals) ? prevFrame.locals : [];
        const maxR = Math.max(prevRows.length, currRows.length);
        const rowTypes = [];
        for (let ri = 0; ri < maxR; ri++) {
          const pText = String(prevRows[ri]?.text ?? prevRows[ri]?.compact_text ?? prevRows[ri]?.full_text ?? '');
          const cText = String(currRows[ri]?.text ?? currRows[ri]?.compact_text ?? currRows[ri]?.full_text ?? '');
          if (ri >= prevRows.length) {
            rowTypes[ri] = 'added';
          } else if (pText !== cText) {
            rowTypes[ri] = 'changed';
          } else {
            rowTypes[ri] = '';
          }
        }
        if (rowTypes.some(Boolean)) diff.stackRowTypes.set(key, rowTypes);
      }
    }
    STEP_DIFFS.push(diff);
    prevGraph = currentGraph;
    prevStack = currentStack;
  }
}

function applyStepHighlights(graphData, stepIndex) {
  const diff = STEP_DIFFS[stepIndex];
  if (!diff) return graphData;
  for (const node of graphData.nodes || []) {
    const nodeType = diff.nodeTypes.get(node.id) || '';
    const color = nodeType === 'added'
      ? DELTA_COLORS.added
      : nodeType === 'changed'
        ? DELTA_COLORS.changed
        : DELTA_COLORS.unchanged;
    node.style = node.style || {};
    node.style.fill = color.fill;
    node.style.stroke = color.stroke;
    node.style.lineWidth = nodeType ? 2 : 1;
    node.style.rowDeltaTypes = diff.nodeRowTypes.get(node.id) || [];
  }
  for (const edge of graphData.edges || []) {
    const added = diff.addedEdgeSigs.has(edgeSignature(edge));
    edge.style = edge.style || {};
    edge.style.stroke = added ? DELTA_COLORS.added.stroke : '#888';
    edge.style.lineWidth = added ? 2 : 1;
    edge.style.endArrow = {
      ...(typeof edge.style.endArrow === 'object' ? edge.style.endArrow : {}),
      fill: added ? DELTA_COLORS.added.stroke : '#888',
    };
  }
  return graphData;
}

function renderAllCode() {

function renderStackPanel(stackData, stepIndex) {
  const stackView = document.getElementById('stackView');
  stackView.innerHTML = '';
  const globals = Array.isArray(stackData?.globals) ? stackData.globals : [];
  const frames = Array.isArray(stackData?.frames) ? stackData.frames : [];

  const normalizeValueText = (row) => {
    if (row?.tree && typeof row.tree.text === 'string' && row.tree.text.length) {
      return row.tree.text;
    }
    if (typeof row?.full_text === 'string' && row.full_text.length) {
      return row.full_text;
    }
    if (typeof row?.compact_text === 'string' && row.compact_text.length) {
      const name = String(row?.name ?? '');
      const compactPrefix = `${name} = `;
      if (name && row.compact_text.startsWith(compactPrefix)) {
        return row.compact_text.slice(compactPrefix.length);
      }
      return row.compact_text;
    }
    const name = String(row?.name ?? '');
    const text = String(row?.text ?? '');
    const prefix = `${name} = `;
    if (name && text.startsWith(prefix)) {
      return text.slice(prefix.length);
    }
    return text;
  };

  const createRow = (row, rowStateKey, rowIndex = 0, frameKey = null, stepIndex = null) => {
    const rowBlock = document.createElement('div');
    rowBlock.className = 'stack-row-block';

    const rowEl = document.createElement('div');
    rowEl.className = `stack-row${row?.kind === 'param' ? ' stack-row-param' : ''}`;
    const nameEl = document.createElement('span');
    nameEl.className = 'stack-name';
    const rawName = String(row?.name ?? '');
    const nameParts = rawName.split('.').filter((p) => p !== '');
    const hasCollapsiblePrefix = nameParts.length >= 2;
    if (!hasCollapsiblePrefix) {
      nameEl.textContent = rawName;
    } else {
      const suffix = nameParts[nameParts.length - 1];
      const prefix = nameParts.slice(0, -1).join('.');
      const toggleEl = document.createElement('span');
      toggleEl.className = 'stack-name-toggle';
      toggleEl.title = '点击展开/收起完整名称';
      const suffixEl = document.createElement('span');
      suffixEl.className = 'stack-name-suffix';
      let expanded = Boolean(STACK_UI_STATE.nameExpanded.get(rowStateKey));

      const renderName = () => {
        if (expanded) {
          toggleEl.textContent = prefix;
          suffixEl.textContent = `.${suffix}`;
          nameEl.style.whiteSpace = 'normal';
          nameEl.style.overflow = 'visible';
          nameEl.style.textOverflow = 'clip';
          nameEl.style.overflowWrap = 'anywhere';
        } else {
          toggleEl.textContent = '...';
          suffixEl.textContent = `.${suffix}`;
          nameEl.style.whiteSpace = 'nowrap';
          nameEl.style.overflow = 'hidden';
          nameEl.style.textOverflow = 'ellipsis';
          nameEl.style.overflowWrap = 'normal';
        }
      };

      toggleEl.addEventListener('click', () => {
        expanded = !expanded;
        STACK_UI_STATE.nameExpanded.set(rowStateKey, expanded);
        renderName();
      });

      renderName();
      nameEl.appendChild(toggleEl);
      nameEl.appendChild(suffixEl);
    }
    const valueEl = document.createElement('span');
    valueEl.className = 'stack-value';
    const valueMain = document.createElement('span');
    valueMain.className = 'stack-value-main';
    let valueExpanded = Boolean(STACK_UI_STATE.valueExpanded.get(rowStateKey));
    const hasHiddenReason = Boolean(row?.hidden_reason);

    const renderValue = () => {
      if (hasHiddenReason) {
        if (valueExpanded) {
          valueMain.textContent = String(row?.full_text || row?.text || normalizeValueText(row) || '');
        } else {
          const compactText = String(row?.compact_text || row?.text || '');
          const name = String(row?.name ?? '');
          const compactPrefix = `${name} = `;
          valueMain.textContent = name && compactText.startsWith(compactPrefix)
            ? compactText.slice(compactPrefix.length)
            : compactText;
        }
      } else {
        valueMain.textContent = normalizeValueText(row);
      }
    };

    if (hasHiddenReason) {
      const valueToggle = document.createElement('span');
      valueToggle.className = 'stack-value-toggle';
      valueToggle.textContent = '...';
      valueToggle.title = '点击展开/收起隐藏内容';
      valueToggle.addEventListener('click', () => {
        valueExpanded = !valueExpanded;
        STACK_UI_STATE.valueExpanded.set(rowStateKey, valueExpanded);
        valueToggle.textContent = valueExpanded ? 'hide' : '...';
        renderValue();
      });
      valueToggle.textContent = valueExpanded ? 'hide' : '...';
      valueEl.appendChild(valueToggle);
    }
    renderValue();
    valueEl.appendChild(valueMain);

    rowEl.appendChild(nameEl);
    rowEl.appendChild(valueEl);
    // mark changed/added rows based on computed diffs
    try {
      if (frameKey && Number.isFinite(rowIndex) && stepIndex != null) {
        const diff = STEP_DIFFS[stepIndex];
        const types = diff && diff.stackRowTypes ? diff.stackRowTypes.get(frameKey) || [] : [];
        const t = types[rowIndex] || '';
        if (t === 'changed' || t === 'added') {
          rowEl.classList.add('stack-row-changed');
        }
      }
    } catch (e) {}

    rowBlock.appendChild(rowEl);

    const tree = row?.tree;
    if (tree && Array.isArray(tree.children) && tree.children.length) {
      const treeWrap = document.createElement('div');
      treeWrap.className = 'stack-tree';

      const listWrap = document.createElement('div');
      const defaultLimit = Number(row?.tree_default_limit) > 0 ? Number(row.tree_default_limit) : 5;
      let treeExpanded = Boolean(STACK_UI_STATE.treeExpanded.get(rowStateKey));
      const children = tree.children;

      const renderChildren = () => {
        listWrap.innerHTML = '';
        const visible = treeExpanded ? children : children.slice(0, defaultLimit);
        visible.forEach((child) => {
          const item = document.createElement('div');
          item.className = 'stack-tree-item';
          const childName = document.createElement('span');
          childName.className = 'stack-tree-item-name';
          childName.textContent = child?.name || '';
          const childValue = document.createElement('span');
          childValue.className = 'stack-tree-item-value';
          childValue.textContent = child?.text || '';
          item.appendChild(childName);
          item.appendChild(childValue);
          listWrap.appendChild(item);
        });

        if (children.length > defaultLimit) {
          const btn = document.createElement('button');
          btn.className = 'stack-tree-more';
          btn.textContent = treeExpanded ? '收起列表' : `显示剩余 ${children.length - defaultLimit} 项`;
          btn.addEventListener('click', () => {
            treeExpanded = !treeExpanded;
            STACK_UI_STATE.treeExpanded.set(rowStateKey, treeExpanded);
            renderChildren();
          });
          listWrap.appendChild(btn);
        }
      };

      renderChildren();
      treeWrap.appendChild(listWrap);
      rowBlock.appendChild(treeWrap);
    }

    return rowBlock;
  };

  const addCard = (title, subtitle, rows, meta = {}) => {
    const cardIndex = stackView.childElementCount;
    const cardStateKey = `${title}|${cardIndex}`;
    const card = document.createElement('div');
    card.className = 'stack-card';
    const titleEl = document.createElement('div');
    titleEl.className = 'stack-title';
    titleEl.textContent = title;
    card.appendChild(titleEl);
    if (subtitle) {
      const subtitleEl = document.createElement('div');
      subtitleEl.className = 'stack-subtitle';
      subtitleEl.textContent = subtitle;
      card.appendChild(subtitleEl);
    }
    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'stack-rows';
    if (!rows.length) {
      const emptyEl = document.createElement('div');
      emptyEl.className = 'stack-empty';
      emptyEl.textContent = '空';
      rowsWrap.appendChild(emptyEl);
    } else {
      rows.forEach((row, rowIdx) => {
        const rowStateKey = `${cardStateKey}|${row?.name || ''}|${rowIdx}`;
        rowsWrap.appendChild(createRow(row, rowStateKey, rowIdx, meta.frameKey, meta.stepIndex));
      });
    }
    card.appendChild(rowsWrap);
    stackView.appendChild(card);
    return card;
  };

  addCard('globals', 'module scope', globals);
  frames.forEach((frame, frameIdx) => {
    const key = frameKey(frame, frameIdx);
    const isModule = frame?.kind === 'module';
    const title = isModule ? (frame?.name || 'main') : `${frame?.name || 'function'}()`;
    const card = addCard(
      title,
      `${frame?.filename || ''}:${frame?.lineno ?? '-'}`,
      Array.isArray(frame?.locals) ? frame.locals : [],
      { frameKey: key, stepIndex }
    );
    card.classList.add('interactive');
    card.setAttribute('data-frame-key', key);
    card.setAttribute('data-step-index', String(stepIndex));
    card.addEventListener('mouseenter', () => {
      setHoveredLine(frame?.lineno, key);
    });
    card.addEventListener('mouseleave', () => {
      if (hoveredFrameKey === key) {
        clearHoveredLine();
      }
    });
    card.addEventListener('click', () => {
      selectedFrameKey = key;
      jumpToStep(stepIndex);
      setHoveredLine(frame?.lineno, key);
    });
    card.addEventListener('contextmenu', (evt) => {
      evt.preventDefault();
      selectedFrameKey = null;
      renderStep(current);
    });
  });
  if (!globals.length && !frames.length) {
    const emptyEl = document.createElement('div');
    emptyEl.className = 'stack-empty';
    emptyEl.textContent = '暂无运行栈数据';
    stackView.appendChild(emptyEl);
  }

  syncStackHighlights();
}

function filterHiddenNodes(graphData) {
  if (!HIDDEN_NODES.size) return graphData;
  const hiddenSet = new Set(HIDDEN_NODES.keys());
  const edges = Array.isArray(graphData?.edges) ? graphData.edges : [];
  
  // Cascade: only from nodes in HIDDEN_NODES_CASCADE
  if (HIDDEN_NODES_CASCADE.size) {
    let changed = true;
    while (changed) {
      changed = false;
      for (const e of edges) {
        const src = String(e.source);
        const dst = String(e.target);
        if (hiddenSet.has(src) && HIDDEN_NODES_CASCADE.has(src) && !hiddenSet.has(dst)) {
          hiddenSet.add(dst);
          changed = true;
        }
      }
    }
  }
  
  const nodes = (Array.isArray(graphData?.nodes) ? graphData.nodes : [])
    .filter((n) => !hiddenSet.has(String(n.id)));
  const visibleIds = new Set(nodes.map((n) => String(n.id)));
  const filteredEdges = edges
    .filter((e) => visibleIds.has(String(e.source)) && visibleIds.has(String(e.target)));
  return { ...(graphData || {}), nodes, edges: filteredEdges };
}

const NODE_VISUAL_LAYOUT = {
  paddingX: 10,
  paddingY: 8,
  rowH: 18,
  defaultHeaderH: 22,
  minCardW: 100,
  maxCardW: 280,
  charPx: 6,
};

function getNodeClassName(style) {
  const className = style?.className || (style?.showSubtitle ? style?.subtitle : '');
  return String(className || '').trim();
}

function parseRowFieldName(rowText, isRef) {
  const raw = String(rowText || '').trim();
  if (!raw) return '';
  if (!isRef && raw.includes(' = ')) {
    return raw.slice(0, raw.indexOf(' = ')).trim();
  }
  for (const sep of [' -> ', ': ', '=>', '→']) {
    if (raw.includes(sep)) {
      return raw.slice(0, raw.indexOf(sep)).trim();
    }
  }
  if (isRef && raw.includes(' ')) {
    return raw.split(/\s+/, 1)[0].trim();
  }
  return raw;
}

function wrapTextToChars(text, maxChars) {
  const raw = String(text || '');
  if (!maxChars || maxChars <= 0) return [raw];
  const lines = raw.split(/\r?\n/);
  const out = [];
  for (const line of lines) {
    if (!line) {
      out.push('');
      continue;
    }
    let cursor = 0;
    while (cursor < line.length) {
      out.push(line.slice(cursor, cursor + maxChars));
      cursor += maxChars;
    }
  }
  return out.length ? out : [''];
}

function measureHorizontalNodeSize(name, subtitleText, rows) {
  const headerLines = String(name || '').split(/\r?\n/);
  const candidateLengths = headerLines.map((line) => line.length);
  if (subtitleText) candidateLengths.push(String(subtitleText).length);
  for (const row of rows) {
    candidateLengths.push(String(row || '').length);
  }
  const maxLen = candidateLengths.length ? Math.max(...candidateLengths) : 0;
  const targetW = Math.round(NODE_VISUAL_LAYOUT.paddingX * 2 + maxLen * NODE_VISUAL_LAYOUT.charPx + 12);
  const cardW = Math.max(NODE_VISUAL_LAYOUT.minCardW, Math.min(NODE_VISUAL_LAYOUT.maxCardW, targetW));
  const maxChars = Math.max(10, Math.floor((cardW - NODE_VISUAL_LAYOUT.paddingX * 2 - 6) / NODE_VISUAL_LAYOUT.charPx));
  const wrappedHeader = wrapTextToChars(name, maxChars);
  let bodyRowCount = 0;
  for (const row of rows) {
    bodyRowCount += Math.max(1, wrapTextToChars(row, maxChars).length);
  }
  const headerH = Math.max(NODE_VISUAL_LAYOUT.defaultHeaderH, wrappedHeader.length * 16) + (subtitleText ? 14 : 0);
  const height = NODE_VISUAL_LAYOUT.paddingY * 2 + headerH + Math.max(bodyRowCount, 1) * NODE_VISUAL_LAYOUT.rowH;
  return { cardW, height, headerH };
}

function buildHorizontalPorts(refRowIndices, headerH, height) {
  const ports = [
    {
      key: 'inL',
      placement: [0, (NODE_VISUAL_LAYOUT.paddingY + headerH / 2) / Math.max(height, 1)],
      r: 0,
      fill: 'transparent',
      stroke: 'transparent',
    },
    {
      key: 'inR',
      placement: [1, (NODE_VISUAL_LAYOUT.paddingY + headerH / 2) / Math.max(height, 1)],
      r: 0,
      fill: 'transparent',
      stroke: 'transparent',
    },
  ];
  const refEntries = [];
  for (const rowIdx of refRowIndices) {
    const y = (NODE_VISUAL_LAYOUT.paddingY + headerH + rowIdx * NODE_VISUAL_LAYOUT.rowH + NODE_VISUAL_LAYOUT.rowH / 2) / Math.max(height, 1);
    ports.push({ key: `pl${rowIdx}`, placement: [0, y], r: 0, fill: 'transparent', stroke: 'transparent' });
    ports.push({ key: `pr${rowIdx}`, placement: [1, y], r: 0, fill: 'transparent', stroke: 'transparent' });
    refEntries.push({ idx: rowIdx, ports: [`pr${rowIdx}`, `pl${rowIdx}`] });
  }
  return {
    ports,
    portLayout: {
      direction: 'LR',
      entry: ['inL', 'inR'],
      ref: refEntries,
    },
  };
}

/* ========================================================================
 * Visibility Section
 * Functions below own field visibility, edge proxying, title substitution,
 * hidden-node tracking, and settings-panel state.  They are consumed by
 * the render pipeline (renderStepImpl) and the settings UI.
 * ======================================================================== */

function buildNodeTypeRegistry() {
  if (nodeTypeRegistryBuilt) return;
  NODE_TYPE_REGISTRY.clear();
  for (const step of STEPS) {
    const nodes = Array.isArray(step?.graph?.nodes) ? step.graph.nodes : [];
    for (const node of nodes) {
      const style = node?.style || {};
      const className = getNodeClassName(style);
      if (!className) continue;
      const rows = Array.isArray(style.rows) ? style.rows : [];
      const rowNames = Array.isArray(style.rowNames) ? style.rowNames : [];
      const rowFieldKeys = Array.isArray(style.rowFieldKeys) ? style.rowFieldKeys : [];
      const rowKinds = Array.isArray(style.rowKinds) ? style.rowKinds : [];
      const refRowSet = new Set(Array.isArray(style.refRowIndices) ? style.refRowIndices : []);
      let group = NODE_TYPE_REGISTRY.get(className);
      if (!group) {
        group = [];
        NODE_TYPE_REGISTRY.set(className, group);
      }
      for (let i = 0; i < rows.length; i++) {
        const kind = rowKinds[i] || (refRowSet.has(i) ? 'ref' : 'field');
        const fieldName = String(rowNames[i] || parseRowFieldName(rows[i], kind === 'ref') || '').trim();
        // Prefer explicit rowFieldKeys provided by backend. They are in the
        // form `Type::field`. Convert to `Type.field` for the global key.
        let key = '';
        const fk = String(rowFieldKeys[i] || '').trim();
        if (fk) {
          const parts = fk.split('::');
          if (parts.length === 2) key = `${parts[0]}.${parts[1]}`;
          else key = fk.replace(/::/g, '.');
        } else if (fieldName) {
          key = `${className}.${fieldName}`;
        }
        if (!key) continue;
        if (!group.some((entry) => entry.key === key)) {
          group.push({ key, className, fieldName, kind });
        }
        if (!NODE_TYPE_VISIBILITY.has(key)) {
          NODE_TYPE_VISIBILITY.set(key, 'visible');
        }
      }
      // Collect bind groups
      const rowBindGroups = Array.isArray(style.rowBindGroups) ? style.rowBindGroups : [];
      if (rowBindGroups.length) {
        let bgList = BIND_GROUP_REGISTRY.get(className);
        if (!bgList) { bgList = []; BIND_GROUP_REGISTRY.set(className, bgList); }
        for (let i = 0; i < rowBindGroups.length; i++) {
          const gname = rowBindGroups[i];
          if (!gname) continue;
          const fk = String(rowFieldKeys[i] || '').trim();
          let key = '';
          if (fk) {
            const parts = fk.split('::');
            key = parts.length === 2 ? `${parts[0]}.${parts[1]}` : fk.replace(/::/g, '.');
          }
          if (!key) continue;
          let entry = bgList.find(e => e.groupName === gname);
          if (!entry) { entry = { groupName: gname, fields: [] }; bgList.push(entry); }
          if (!entry.fields.includes(key)) entry.fields.push(key);
        }
      }
      // Add __title__ as a hideable pseudo-field
      const titleKey = `${className}.__title__`;
      if (!group.some(e => e.key === titleKey)) {
        group.push({ key: titleKey, className, fieldName: '标题', kind: 'title' });
      }
      if (!NODE_TYPE_VISIBILITY.has(titleKey)) {
        NODE_TYPE_VISIBILITY.set(titleKey, 'visible');
      }
    }
  }
  nodeTypeRegistryBuilt = true;
}

function setNodeFieldVisible(key, state) {
  NODE_TYPE_VISIBILITY.set(key, state || 'visible');
  persistVisibility();
  syncSettingsPanel();
  renderStep(current);
}

/** Left-click cycle: visible → self → cascade → visible */
function toggleNodeFieldVisible(key) {
  const cur = NODE_TYPE_VISIBILITY.get(key);
  if (cur === 'self') {
    // If currently self-hidden, check if any child fields exist → offer cascade
    NODE_TYPE_VISIBILITY.set(key, 'cascade');
  } else if (cur === 'cascade' || cur === false) {
    NODE_TYPE_VISIBILITY.set(key, 'visible');
  } else {
    NODE_TYPE_VISIBILITY.set(key, 'self');
  }
  syncSettingsPanel();
  renderStep(current);
}

/** Toggle all fields in a bind group together. */
function toggleBindGroup(className, groupName) {
  const bgList = BIND_GROUP_REGISTRY.get(className);
  if (!bgList) return;
  const entry = bgList.find(e => e.groupName === groupName);
  if (!entry || !entry.fields.length) return;
  // If any field is visible, hide all (self); otherwise show all
  const anyVisible = entry.fields.some(k => {
    const s = NODE_TYPE_VISIBILITY.get(k);
    return s === 'visible' || s === true || s === undefined;
  });
  const newState = anyVisible ? 'self' : 'visible';
  for (const key of entry.fields) {
    NODE_TYPE_VISIBILITY.set(key, newState);
  }
  syncSettingsPanel();
  renderStep(current);
}

/** Check whether a field key is visible, considering parent-field cascade.
 *  NODE_TYPE_VISIBILITY values: true/'visible' | 'self' (hidden only) | 'cascade' (hidden + children)
 *  Keys like "GraphNode.neighbors[0]" also check "GraphNode.neighbors". */
function isFieldVisible(key) {
  if (!key) return true;
  const state = NODE_TYPE_VISIBILITY.get(key);
  if (state === 'self' || state === 'cascade' || state === false) return false;
  // Check base key — both self and cascade hide children
  const baseMatch = key.match(/^(.+?)\[.*\]$/);
  if (baseMatch) {
    const baseState = NODE_TYPE_VISIBILITY.get(baseMatch[1]);
    if (baseState === 'self' || baseState === 'cascade' || baseState === false) return false;
  }
  return true;
}

function applyNodeTypeVisibility(graphData) {
  buildNodeTypeRegistry();
  let hasHidden = false;
  for (const state of NODE_TYPE_VISIBILITY.values()) {
    if (state !== 'visible' && state !== true && state !== undefined) {
      hasHidden = true;
      break;
    }
  }
  if (!hasHidden) return graphData;

  const working = cloneGraphData(graphData);
  const originalNodes = Array.isArray(working.nodes) ? working.nodes : [];
  const originalEdges = Array.isArray(working.edges) ? working.edges : [];
  const nodeById = new Map(originalNodes.map((node) => [String(node.id), node]));
  const originalInDegree = new Map(originalNodes.map((node) => [String(node.id), 0]));
  for (const edge of originalEdges) {
    const targetId = String(edge?.target ?? '');
    if (originalInDegree.has(targetId)) {
      originalInDegree.set(targetId, (originalInDegree.get(targetId) || 0) + 1);
    }
  }

  const edgeMeta = [];
  for (const edge of originalEdges) {
    const srcId = String(edge?.source ?? '');
    const srcNode = nodeById.get(srcId);
    const srcStyle = srcNode?.style || {};
    const className = getNodeClassName(srcStyle);
    // Prefer explicit field keys on edges if provided by backend (edge.data.field_key)
    const edgeFieldKeyRaw = String(edge?.field_key || edge?.data?.field_key || '').trim();
    let hiddenKey = '';
    if (edgeFieldKeyRaw) {
      const parts = edgeFieldKeyRaw.split('::');
      hiddenKey = parts.length === 2 ? `${parts[0]}.${parts[1]}` : edgeFieldKeyRaw.replace(/::/g, '.');
    } else {
      const fieldName = String(edge?.data?.label || '').trim();
      hiddenKey = className && fieldName ? `${className}.${fieldName}` : '';
    }
    let effectiveKey = hiddenKey;
    let forceVisible = false;
    if (hiddenKey && !isFieldVisible(hiddenKey)) {
      const state = NODE_TYPE_VISIBILITY.get(hiddenKey);
      const baseMatch = hiddenKey.match(/^(.+?)\[.*\]$/);
      const baseState = baseMatch ? NODE_TYPE_VISIBILITY.get(baseMatch[1]) : null;
      const isCascade = (state === 'cascade' || state === false) ||
                        (baseState === 'cascade' || baseState === false);
      // Check EDGE_PROXY: redirect in cascade mode, keep alive in self mode
      const parentKey = baseMatch ? baseMatch[1] : hiddenKey;
      const rule = EDGE_PROXY.get(parentKey);
      if (isCascade && rule && isFieldVisible(rule.proxy)) {
        const idxMatch = hiddenKey.match(/\[(\d+)\]$/);
        const hiddenIdx = idxMatch ? parseInt(idxMatch[1]) : 0;
        if (rule.ratio === 'auto') {
          const fks = Array.isArray(srcStyle.rowFieldKeys) ? srcStyle.rowFieldKeys : [];
          let proxyCount = fks.filter(k => {
            const nk = k.replace(/^.*::/, '').replace(/^.*\./, '');
            return nk.startsWith(rule.proxy.split('.').pop() + '[');
          }).length || 1;
          let targetCount = fks.filter(k => {
            const nk = k.replace(/^.*::/, '').replace(/^.*\./, '');
            return nk.startsWith(parentKey.split('.').pop() + '[');
          }).length || 1;
          const slots = rule.includeEnds !== false ? proxyCount + 1 : proxyCount;
          const slotIdx = Math.floor(hiddenIdx * slots / targetCount);
          const proxyIdx = Math.min(slotIdx, proxyCount - 1);
          effectiveKey = `${rule.proxy}[${proxyIdx}]`;
        } else {
          const proxyIdx = Math.floor(hiddenIdx / (rule.ratio || 1));
          effectiveKey = `${rule.proxy}[${proxyIdx}]`;
        }
      } else if (!isCascade) {
        forceVisible = true;  // self-mode: edge survives with original key (spacer rows handle it)
      }
    }
    const hidden = forceVisible ? false : (effectiveKey ? (!isFieldVisible(effectiveKey)) : false);
    if (effectiveKey !== hiddenKey) {
      const substEdge = { ...edge, data: { ...(edge?.data || {}), field_key: effectiveKey.replace(/\./g, '::'), label: effectiveKey.split('.').pop(), _proxyKey: effectiveKey } };
      edgeMeta.push({ edge: substEdge, hidden, srcId });
    } else {
      edgeMeta.push({ edge, hidden, srcId });
    }
  }

  const filteredEdges = edgeMeta.filter((entry) => !entry.hidden).map((entry) => entry.edge);
  const connectedNodeIds = new Set();
  for (const edge of filteredEdges) {
    if (edge?.source !== undefined) connectedNodeIds.add(String(edge.source));
    if (edge?.target !== undefined) connectedNodeIds.add(String(edge.target));
  }

  const filteredNodes = [];
  for (const node of originalNodes) {
    const id = String(node.id);
    const style = node.style || {};
    const className = getNodeClassName(style);
    const rows = Array.isArray(style.rows) ? style.rows : [];
    const rowNames = Array.isArray(style.rowNames) ? style.rowNames : [];
    const rowKinds = Array.isArray(style.rowKinds) ? style.rowKinds : [];
    const rowBindGroups = Array.isArray(style.rowBindGroups) ? style.rowBindGroups : [];
    const rowBindBlocks = Array.isArray(style.rowBindBlocks) ? style.rowBindBlocks : [];
    const rowDeltaTypes = Array.isArray(style.rowDeltaTypes) ? style.rowDeltaTypes : [];
    const refRows = new Set(Array.isArray(style.refRowIndices) ? style.refRowIndices : []);
    const keptRows = [];
    const keptChildRows = []; // target rows kept as spacers
    const keptRowNames = [];
    const keptRowKinds = [];
    const keptRowBindGroups = [];
    const keptRowBindBlocks = [];
    const keptRowDeltaTypes = [];
    const keptRefRowIndices = [];
    const keptRefLabelMap = {};

    for (let i = 0; i < rows.length; i++) {
      const kind = rowKinds[i] || (refRows.has(i) ? 'ref' : 'field');
      const fieldName = String(rowNames[i] || parseRowFieldName(rows[i], kind === 'ref') || '').trim();
      // Prefer explicit rowFieldKeys when present
      const rowFieldKeys = Array.isArray(style.rowFieldKeys) ? style.rowFieldKeys : [];
      const fk = String(rowFieldKeys[i] || '').trim();
      let key = '';
      if (fk) {
        const parts = fk.split('::');
        key = parts.length === 2 ? `${parts[0]}.${parts[1]}` : fk.replace(/::/g, '.');
      } else {
        key = className && fieldName ? `${className}.${fieldName}` : '';
      }
      if (key && !isFieldVisible(key)) {
        // Self-mode + edge proxy target ref → keep as invisible spacer with port
        const state = NODE_TYPE_VISIBILITY.get(key);
        const baseM = key.match(/^(.+?)(\[.*\])?$/);
        const baseKey = baseM ? baseM[1] : key;
        const baseState = baseM ? NODE_TYPE_VISIBILITY.get(baseKey) : null;
        const isSelf = (state === 'self') || (baseState === 'self');
        if (isSelf && kind === 'ref' && EDGE_PROXY.has(baseKey)) {
          const si = keptRows.length;
          keptRows.push('');  // invisible spacer
          keptRowNames.push(rowNames[i] || fieldName);
          keptRowKinds.push('ref');  // keep as ref so edge has port
          keptRowBindGroups.push(rowBindGroups[i] ?? null);
          keptRowBindBlocks.push(rowBindBlocks[i] ?? null);
          keptRowDeltaTypes.push(rowDeltaTypes[i] ?? null);
          keptRefRowIndices.push(si);
        }
        continue;
      }
      const nextIndex = keptRows.length;
      keptRows.push(rows[i]);
      keptRowNames.push(rowNames[i] || fieldName);
      keptRowKinds.push(kind);
      keptRowBindGroups.push(rowBindGroups[i] ?? null);
      keptRowBindBlocks.push(rowBindBlocks[i] ?? null);
      keptRowDeltaTypes.push(rowDeltaTypes[i] ?? null);
      if (kind === 'ref') {
        keptRefRowIndices.push(nextIndex);
        if (!(rows[i] in keptRefLabelMap)) {
          keptRefLabelMap[rows[i]] = nextIndex;
        }
      }
    }

    const nodeVisible = originalInDegree.get(id) === 0 || connectedNodeIds.has(id);
    if (!nodeVisible) continue;

    // ── Add all proxy rows (including array items) to refRowIndices ──
    for (const [targetKey, rule] of EDGE_PROXY) {
      if (!targetKey.startsWith(className + '.')) continue;
      const origFKs = Array.isArray(style.rowFieldKeys) ? style.rowFieldKeys : [];
      for (let i = 0; i < keptRows.length; i++) {
        const rowText = keptRows[i];
        let origIdx = -1;
        for (let oi = 0; oi < origFKs.length; oi++) {
          if ((Array.isArray(style.rows) ? style.rows[oi] : '') === rowText) { origIdx = oi; break; }
        }
        if (origIdx < 0) continue;
        const fk = String(origFKs[origIdx] || '').trim();
        let rk = '';
        if (fk) { const p = fk.split('::'); rk = p.length === 2 ? `${p[0]}.${p[1]}` : fk.replace(/::/g, '.'); }
        // Match proxy or proxy items (e.g., "keys" or "keys[0]")
        const proxyBase = rule.proxy;
        if ((rk === proxyBase || rk.startsWith(proxyBase + '[')) && !keptRefRowIndices.includes(i)) {
          keptRefRowIndices.push(i);
          keptRefRowIndices.sort((a, b) => a - b);
          if (!(rowText in keptRefLabelMap)) keptRefLabelMap[rowText] = i;
        }
      }
    }

    // ── Interleave proxy spacers between proxy rows (runs after all row modifications) ──
    const hasSpacers = keptRows.some((r, i) => r === '' && keptRowKinds[i] === 'ref');
    if (hasSpacers) {
      const proxyBases = [];
      for (const [tk, rule] of EDGE_PROXY) {
        if (tk.startsWith(className + '.')) proxyBases.push(rule.proxy);
      }
      const indexed = keptRows.map((r, i) => ({
        row: r, name: keptRowNames[i], kind: keptRowKinds[i],
        bindG: keptRowBindGroups[i], bindB: keptRowBindBlocks[i],
        delta: keptRowDeltaTypes[i],
        isSpacer: r === '' && keptRowKinds[i] === 'ref',
        proxyIndex: -1, spacerIndex: -1
      }));
      let pi = 0, si = 0;
      for (const it of indexed) {
        if (it.isSpacer) { it.spacerIndex = si++; }
        else {
          const rk = (it.name || '').trim();
          const isProxy = proxyBases.some(pb => rk === pb.split('.').pop() || rk.startsWith(pb.split('.').pop() + '['));
          if (isProxy) { it.proxyIndex = pi++; }
        }
      }
      indexed.sort((a, b) => {
        const ap = a.isSpacer ? a.spacerIndex * 2 + 1 : (a.proxyIndex >= 0 ? a.proxyIndex * 2 : 9999);
        const bp = b.isSpacer ? b.spacerIndex * 2 + 1 : (b.proxyIndex >= 0 ? b.proxyIndex * 2 : 9999);
        return ap - bp;
      });
      keptRows.length = 0; keptRows.push(...indexed.map(it => it.row));
      keptRowNames.length = 0; keptRowNames.push(...indexed.map(it => it.name));
      keptRowKinds.length = 0; keptRowKinds.push(...indexed.map(it => it.kind));
      keptRowBindGroups.length = 0; keptRowBindGroups.push(...indexed.map(it => it.bindG));
      keptRowBindBlocks.length = 0; keptRowBindBlocks.push(...indexed.map(it => it.bindB));
      keptRowDeltaTypes.length = 0; keptRowDeltaTypes.push(...indexed.map(it => it.delta));
      const newRefs = [], newRefMap = {};
      for (let i = 0; i < keptRows.length; i++) {
        if (keptRowKinds[i] === 'ref') {
          newRefs.push(i);
          if (!(keptRows[i] in newRefMap)) newRefMap[keptRows[i]] = i;
        }
      }
      keptRefRowIndices.length = 0; keptRefRowIndices.push(...newRefs);
      for (const k of Object.keys(keptRefLabelMap)) delete keptRefLabelMap[k];
      Object.assign(keptRefLabelMap, newRefMap);
    }

    // ── Title visibility ──
    const titleKey = `${className}.__title__`;
    const titleVisible = isFieldVisible(titleKey);
    let effectiveName = style.name;
    let effectiveSubtitle = style.showSubtitle ? style.subtitle : null;
    if (!titleVisible) {
      effectiveName = '';
      effectiveSubtitle = null;
    }

    const nextStyle = { ...style };
    nextStyle.rows = keptRows;
    nextStyle.rowNames = keptRowNames;
    nextStyle.rowKinds = keptRowKinds;
    nextStyle.rowBindGroups = keptRowBindGroups;
    nextStyle.rowBindBlocks = keptRowBindBlocks;
    nextStyle.rowDeltaTypes = keptRowDeltaTypes;
    nextStyle.refRowIndices = keptRefRowIndices;
    nextStyle.refLabelMap = keptRefLabelMap;

    nextStyle.showSubtitle = nextStyle.showSubtitle && titleVisible && VIS_CONFIG.showSubtitle;
    nextStyle.name = effectiveName;

    const subtitleText = effectiveSubtitle;
    const sizeInfo = measureHorizontalNodeSize(effectiveName, subtitleText, keptRows);
    nextStyle.size = [sizeInfo.cardW, sizeInfo.height];
    nextStyle.headerHeight = sizeInfo.headerH;
    const portInfo = buildHorizontalPorts(keptRefRowIndices, sizeInfo.headerH, sizeInfo.height);
    nextStyle.ports = portInfo.ports;
    nextStyle.portLayout = portInfo.portLayout;

    // ── Title substitution ──
    if (TITLE_FIELD && TITLE_FIELD.className === className) {
      for (let i = 0; i < keptRows.length; i++) {
        const origFieldKeys = Array.isArray(style.rowFieldKeys) ? style.rowFieldKeys : [];
        const rowText = keptRows[i];
        let origIdx = -1;
        for (let oi = 0; oi < origFieldKeys.length; oi++) {
          if ((Array.isArray(style.rows) ? style.rows[oi] : '') === rowText) { origIdx = oi; break; }
        }
        if (origIdx < 0) continue;
        const fk = String(origFieldKeys[origIdx] || '').trim();
        let rk = '';
        if (fk) { const p = fk.split('::'); rk = p.length === 2 ? `${p[0]}.${p[1]}` : fk.replace(/::/g, '.'); }
        if (rk === TITLE_FIELD.key) {
          nextStyle.name = String(keptRows[i] || nextStyle.name);
          break;
        }
      }
    }

    node.style = nextStyle;
    filteredNodes.push(node);
  }

  // ── Post-process proxy edges: update refIndex to match proxy row position ──
  const nodeByFilteredId = new Map(filteredNodes.map(n => [String(n.id), n]));
  for (const entry of edgeMeta) {
    const proxyKey = entry.edge?.data?._proxyKey;
    if (!proxyKey) continue;
    const srcNode = nodeByFilteredId.get(entry.srcId);
    if (!srcNode) continue;
    const sn = srcNode.style || {};
    const rows = sn.rows || [];
    const rowFKs = sn.rowFieldKeys || [];
    for (let i = 0; i < rows.length; i++) {
      const fk = String(rowFKs[i] || '').trim();
      let rk = '';
      if (fk) { const p = fk.split('::'); rk = p.length === 2 ? `${p[0]}.${p[1]}` : fk.replace(/::/g, '.'); }
      if (rk === proxyKey) {
        entry.edge.data.refIndex = i;
        break;
      }
    }
  }

  const visibleNodeIds = new Set(filteredNodes.map((node) => String(node.id)));
  const visibleEdges = filteredEdges.filter((edge) => visibleNodeIds.has(String(edge.source)) && visibleNodeIds.has(String(edge.target)));
  return { ...(working || {}), nodes: filteredNodes, edges: visibleEdges };
}

function hideNode(nodeId, label, cascade = false) {
  const id = String(nodeId);
  if (!label && graph) {
    const nd = graph.getNodeData?.(id);
    label = nd?.style?.name || nd?.data?.name || id;
  }
  HIDDEN_NODES.set(id, label || id);
  if (cascade) {
    HIDDEN_NODES_CASCADE.add(id);
    // Cascade: recursively hide all descendant nodes reachable via outgoing edges
    if (graph) {
      const allEdges = graph.getEdgeData?.() || [];
      const queue = [id];
      const visited = new Set([id]);
      while (queue.length) {
        const cur = queue.shift();
        for (const e of allEdges) {
          if (String(e.source) === cur && !visited.has(String(e.target))) {
            const childId = String(e.target);
            visited.add(childId);
            const nd = graph.getNodeData?.(childId);
            const childLabel = nd?.style?.name || nd?.data?.name || childId;
            HIDDEN_NODES.set(childId, childLabel);
            queue.push(childId);
          }
        }
      }
    }
  }
  syncHiddenPanel();
  renderStep(current);
}

function restoreNode(nodeId) {
  HIDDEN_NODES.delete(String(nodeId));
  HIDDEN_NODES_CASCADE.delete(String(nodeId));
  syncHiddenPanel();
  renderStep(current);
}

function toggleHiddenPanel() {
  hiddenPanelVisible = !hiddenPanelVisible;
  const panel = document.getElementById('hiddenNodesPanel');
  if (panel) panel.classList.toggle('open', hiddenPanelVisible);

function syncHiddenPanel() {
  const list = document.getElementById('hiddenNodesList');
  const btn = document.getElementById('hiddenNodesBtn');
  if (btn) {
    btn.setAttribute('data-count', HIDDEN_NODES.size);
    btn.classList.toggle('has-count', HIDDEN_NODES.size > 0);
    btn.title = HIDDEN_NODES.size ? `隐藏节点 (${HIDDEN_NODES.size}个)` : '隐藏节点列表';
  }
  if (!list) return;
  list.innerHTML = '';
  if (!HIDDEN_NODES.size) {
    const empty = document.createElement('div');
    empty.className = 'stack-empty';
    empty.textContent = '没有隐藏的节点（右键点击图节点可隐藏）';
    list.appendChild(empty);
    return;
  }
  for (const [id, label] of HIDDEN_NODES) {
    const item = document.createElement('div');
    item.className = 'hidden-node-item';
    item.textContent = String(label);
    item.title = `恢复显示: ${String(label)}`;
    item.addEventListener('click', () => restoreNode(id));
    list.appendChild(item);
  }
}

function renderStep(i) {
  if (!DISPLAY_INDICES.length) return;
  current = Math.max(0, Math.min(i, DISPLAY_INDICES.length - 1));
  currentRaw = null;  // back to display-index mode
  scheduleRenderStepImpl(toReal(current), current);
}

// Render from a raw STEPS index directly (for execution-level stepping)
function renderStepRaw(ri) {
  if (!STEPS.length || ri < 0 || ri >= STEPS.length) return;
  current = toDisplay(ri);
  currentRaw = ri;
  scheduleRenderStepImpl(ri, current);
}

function scheduleRenderStepImpl(ri, displayIndex) {
  pendingRenderRequest = { ri, displayIndex };
  if (renderRafId != null) return;
  renderRafId = requestAnimationFrame(() => {
    renderRafId = null;
    const req = pendingRenderRequest;
    pendingRenderRequest = null;
    if (!req) return;
    renderStepImpl(req.ri, req.displayIndex);
  });
}

function renderStepImpl(ri, displayIndex) {
  hoveredLine = null;
  hoveredFrameKey = null;
  const s = STEPS[ri];
  const rawGraph = applyStepHighlights(cloneGraphData(s.graph), ri);
  const typeFilteredGraph = applyNodeTypeVisibility(rawGraph);
  const adaptedGraph = adaptNodesForTextFlow(typeFilteredGraph);
  const graphData = filterHiddenNodes(adaptedGraph);
  const frames = Array.isArray(s?.stack?.frames) ? s.stack.frames : [];
  if (frames.length) {
    const hasSelection = selectedFrameKey && frames.some((frame, idx) => frameKey(frame, idx) === selectedFrameKey);
    if (!hasSelection) {
      selectedFrameKey = null;
    }
  } else {
    selectedFrameKey = null;
  }
  renderStackPanel(s.stack, displayIndex);

  if (!graph) {
    initGraph(graphData);
  } else {
    const prepared = prepareGraphForLayout(graphData, getGraphSize());
    const nextLayout = prepared.layout;
    // Tag node data with a render epoch so G6 always sees a change
    // even when VIS_CONFIG (external) is the only thing that changed.
    const now = Date.now();
    for (const n of (prepared.data.nodes || [])) {
      if (n.style) n.style._renderEpoch = now;
    }
    if (typeof graph.setOptions === 'function' && nextLayout.type !== 'preset') {
      graph.setOptions({ layout: nextLayout });
    } else if (typeof graph.setLayout === 'function' && nextLayout.type !== 'preset') {
      graph.setLayout(nextLayout);
    }
    graph.setData(prepared.data);
    if (typeof graph.once === 'function') {
      graph.once('afterlayout', refreshGraphVisuals);
      graph.once('afterrender', refreshGraphVisuals);
    }
    graph.render();
  }

  syncCodeHighlights(true);
  syncStackHighlights();
}

window.addEventListener('keydown', (evt) => {
  // Ignore when typing in inputs
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

  if (evt.key === 'F5' && evt.shiftKey) {
    evt.preventDefault();
    stopDebugSession();
    return;
  }

  if (evt.key === 'F5') {
    evt.preventDefault();
    if (!debugSessionStopped) startAutoRun();
    return;
  }

  if (evt.key === 'F10') {
    evt.preventDefault();
    if (debugSessionStopped) return;
    stopAutoRun();
    const ri = findStepOverRaw();
    if (ri >= 0) renderStepRaw(ri);
    return;
  }

  if (evt.key === 'F11') {
    evt.preventDefault();
    if (debugSessionStopped) return;
    stopAutoRun();
    // If Shift is held, this is Step Out
    if (evt.shiftKey) {
      const ri = findStepOutRaw();
      if (ri >= 0) renderStepRaw(ri);
    } else {
      const ri = findStepIntoRaw();
      if (ri >= 0) renderStepRaw(ri);
    }
    return;
  }
});

  if (!PANEL_STATE.stackVisible) return;
  const root = getRootElement();
  if (!root) return;
  const rect = root.getBoundingClientRect();
  if (clientX - rect.left <= EDGE_HIDE_CONFIG.hideThresholdPx) {
    PANEL_STATE.stackVisible = false;
    setPaneVisible('stack', false, '隐藏', '恢复');
    return;
  }
  setStackWidthPx(clientX - rect.left);
});

bindHorizontalResizer('rightResizeHandle', (clientX) => {

  const root = getRootElement();
  if (!root) return;
  const rect = root.getBoundingClientRect();
  if (rect.right - clientX <= EDGE_HIDE_CONFIG.hideThresholdPx) {
    PANEL_STATE.codeVisible = false;

        e.preventDefault();

        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';

        menu._fieldLabel = field.fieldName;
        const closeMenu = (ev) => {
          if (ev.type === 'keydown' && ev.key === 'Escape') { menu.style.display = 'none'; cleanup(); }
          else if (ev.type === 'click' && !menu.contains(ev.target)) { menu.style.display = 'none'; cleanup(); }
        };
        const cleanup = () => {
          document.removeEventListener('click', closeMenu);
          document.removeEventListener('keydown', closeMenu);
        };
        document.addEventListener('click', closeMenu);
        document.addEventListener('keydown', closeMenu);
      });
      
      items.appendChild(item);
    }

    group.appendChild(header);
    group.appendChild(items);
    list.appendChild(group);

    // ── Edge proxy config ──
    const nonRefFields = fields.filter(f => f.kind !== 'ref' && f.kind !== 'title');
    const refFields = fields.filter(f => f.kind === 'ref');
    const allTargetRefs = [...refFields];
    // Include container parents of ref items (e.g., "children" is parent of "children[0]")
    for (const f of fields) {
      if (f.kind === 'ref' || f.kind === 'title') continue;
      if (refFields.some(rf => rf.key.startsWith(f.key + '['))) {
        if (!allTargetRefs.some(t => t.key === f.key)) allTargetRefs.push(f);

      const proxyGroup = document.createElement('div');

      proxyHeader.className = 'node-type-group-header';

      proxyItems.className = 'node-type-items proxy-items';

      // List existing rules
      const renderProxyRules = () => {
        proxyItems.innerHTML = '';
        for (const [targetKey, rule] of EDGE_PROXY) {
          if (!targetKey.startsWith(className + '.')) continue;

          });

          const arrow = document.createElement('span');
          arrow.textContent = '→';

          const tSel = document.createElement('select');
          tSel.style.fontSize = '10px';
          for (const f of allTargetRefs) {
            const o = document.createElement('option');
            o.value = f.key; o.textContent = f.fieldName;
            if (f.key === targetKey) o.selected = true;
            tSel.appendChild(o);
          }

          const ratioLabel = document.createElement('span');
          ratioLabel.textContent = '1:';
          ratioLabel.style.fontSize = '9px';
          const ratioInput = document.createElement('input');
          ratioInput.type = 'number'; ratioInput.min = '1'; ratioInput.max = '99';
          ratioInput.value = rule.ratio === 'auto' ? '' : (rule.ratio || 1);
          ratioInput.style.cssText = 'width:28px;font-size:10px';
          ratioInput.disabled = rule.ratio === 'auto';
          const autoCb = document.createElement('input');
          autoCb.type = 'checkbox'; autoCb.checked = rule.ratio === 'auto';
          autoCb.style.cssText = 'width:12px;height:12px;margin-left:2px';
          autoCb.title = '自动检测比例';
          autoCb.addEventListener('change', () => {
            const nt = tSel.value;
            if (autoCb.checked) {
              ratioInput.disabled = true;
              ratioInput.value = '';
              if (nt) EDGE_PROXY.set(nt, { proxy: pSel.value, ratio: 'auto', includeEnds: rule.includeEnds !== false });
            } else {
              ratioInput.disabled = false;
              ratioInput.value = '1';
              if (nt) EDGE_PROXY.set(nt, { proxy: pSel.value, ratio: 1, includeEnds: rule.includeEnds !== false });
            }
            reapplyStep();
          });
          const endsCb = document.createElement('input');
          endsCb.type = 'checkbox'; endsCb.checked = rule.includeEnds !== false;
          endsCb.style.cssText = 'width:12px;height:12px';
          endsCb.title = '含端点';
          endsCb.addEventListener('change', () => {
            const nt = tSel.value;

          ratioInput.addEventListener('change', () => {
            const r = Math.max(1, parseInt(ratioInput.value) || 1);
            const nt = tSel.value;
            if (nt) EDGE_PROXY.set(nt, { proxy: pSel.value, ratio: r, includeEnds: rule.includeEnds !== false });
            reapplyStep();
          });

          const delBtn = document.createElement('button');
          delBtn.textContent = '✕'; delBtn.type = 'button';
          delBtn.style.cssText = 'font-size:9px;padding:0 4px;cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:3px';
          delBtn.addEventListener('click', () => {
            EDGE_PROXY.delete(targetKey);
            reapplyStep();
          });

          // Update target key when dropdown changes
          const oldTargetKey = targetKey;
          tSel.addEventListener('change', () => {
            const nt = tSel.value;
            if (nt && nt !== oldTargetKey) {
              EDGE_PROXY.delete(oldTargetKey);
              EDGE_PROXY.set(nt, { proxy: pSel.value, ratio: rule.ratio, includeEnds: rule.includeEnds !== false });
            }
            reapplyStep();
          });

          row.appendChild(pSel);
          row.appendChild(arrow);
          row.appendChild(tSel);
          const autoLabel = document.createElement('label');
          autoLabel.style.cssText = 'font-size:9px;display:flex;align-items:center;gap:1px';

          autoLabel.appendChild(document.createTextNode('自动'));
          row.appendChild(autoLabel);
          row.appendChild(ratioLabel);
          row.appendChild(ratioInput);
          const endsLabel = document.createElement('label');
          endsLabel.style.cssText = 'font-size:9px;display:flex;align-items:center;gap:1px';
          endsLabel.appendChild(endsCb);
          endsLabel.appendChild(document.createTextNode('端点'));
          row.appendChild(endsLabel);
          row.appendChild(delBtn);
          proxyItems.appendChild(row);
        }

        // Add-new button
        const addRow = document.createElement('div');
        addRow.style.cssText = 'margin-top:4px';
        const addBtn = document.createElement('button');
        addBtn.textContent = '+ 新增边代理'; addBtn.type = 'button';
        addBtn.style.cssText = 'font-size:10px;padding:2px 8px;cursor:pointer;border:1px dashed #aaa;background:#fafafa;border-radius:3px';
        addBtn.addEventListener('click', () => {
          if (allTargetRefs.length > 0 && nonRefFields.length > 0) {
            const defaultTarget = allTargetRefs[0].key;
            const keysField = nonRefFields.find(f => f.fieldName === 'keys') || nonRefFields[0];
            const defaultProxy = keysField.key;
            if (!EDGE_PROXY.has(defaultTarget)) {
              EDGE_PROXY.set(defaultTarget, { proxy: defaultProxy, ratio: 'auto', includeEnds: true });
              reapplyStep();

          }
        });
        addRow.appendChild(addBtn);
        proxyItems.appendChild(addRow);
      };

      renderProxyRules();
      proxyGroup.appendChild(proxyItems);
      list.appendChild(proxyGroup);
    }

    // ── Title substitution: keep simple per-field dropdown ──
    const titleGroup = document.createElement('div');
    titleGroup.className = 'node-type-group title-group';
    const titleHeader = document.createElement('div');
    titleHeader.className = 'node-type-group-header';
    const thTitle = document.createElement('span');
    thTitle.className = 'node-type-group-title';
    thTitle.textContent = '标题替换';
    titleHeader.appendChild(thTitle);
    titleGroup.appendChild(titleHeader);
    const titleItems = document.createElement('div');
    titleItems.className = 'node-type-items';
    const titleRow = document.createElement('div');
    titleRow.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:10px';

    titleSel.style.fontSize = '10px';

    noneOpt.value = ''; noneOpt.textContent = '默认标题';
    titleSel.appendChild(noneOpt);
    for (const f of fields) {
      const o = document.createElement('option');

      if (TITLE_FIELD && TITLE_FIELD.key === f.key) o.selected = true;
      titleSel.appendChild(o);
    }
    titleSel.addEventListener('change', () => {
      if (titleSel.value) {

    titleRow.appendChild(titleLabel);

  }

function normalizeAgentFieldKey(fieldKey) {
  return String(fieldKey || '').replace(/::/g, '.').trim();
}

function serializeRegistryMap(map) {
  return Array.from(map.entries()).map(([className, fields]) => ({
    className,
    fields: fields.map((field) => ({ ...field })),
  }));
}

function getCurrentStepForAgent() {
  const rawIndex = currentRaw != null ? currentRaw : toReal(current);
  return STEPS[rawIndex] || null;
}

const DSVisLogger = (() => {
  let _level = 'info';
  const levels = { debug: 0, info: 1, warn: 2, error: 3, none: 4 };
  function log(level, module, event, data) {
    if (levels[level] >= levels[_level]) {
      const prefix = `[dsvis:${module}]`;
      const extra = data != null ? ' ' + JSON.stringify(data) : '';
      const msg = event + extra;
      switch (level) {
        case 'error': console.error(prefix, msg); break;
        case 'warn': console.warn(prefix, msg); break;
        default: console.log(prefix, msg);
      }
    }
  }
  return {
    get level() { return _level; },
    setLevel(l) { if (levels[l] !== undefined) _level = l; },
    debug: (m, e, d) => log('debug', m, e, d),
    info: (m, e, d) => log('info', m, e, d),
    warn: (m, e, d) => log('warn', m, e, d),
    error: (m, e, d) => log('error', m, e, d),
  };
})();

function createAgentAPI() {
  return {
    getCurrentStepSummary() {
      const step = getCurrentStepForAgent();
      return {
        rawIndex: currentRaw != null ? currentRaw : toReal(current),
        displayIndex: current,
        lineno: step?.lineno ?? null,
        stack: step?.stack || null,
      };
    },
    getGraphSchema() {
      buildNodeTypeRegistry();
      return {
        classes: serializeRegistryMap(NODE_TYPE_REGISTRY),
        bindGroups: serializeRegistryMap(BIND_GROUP_REGISTRY),
      };
    },
    getPresentationConfig() {
      return {
        textFlow: VIS_CONFIG.textFlow,
        showSubtitle: VIS_CONFIG.showSubtitle,
        visibility: Object.fromEntries(NODE_TYPE_VISIBILITY),
        edgeProxy: Object.fromEntries(EDGE_PROXY),
        titleField: TITLE_FIELD ? { ...TITLE_FIELD } : null,
        hiddenNodes: Array.from(HIDDEN_NODES.keys()),
        activePresetId: getActivePresetId(),
        pageAgent: { ...loadPageAgentConfig(), apiKey: undefined },
        logLevel: DSVisLogger.level,
      };
    },
    getRenderDiagnostics() {
      return {
        nodeCount: graph?.getNodeData?.().length || 0,
        edgeCount: graph?.getEdgeData?.().length || 0,
        pendingRender: Boolean(pendingRenderRequest),
        currentStep: this.getCurrentStepSummary(),
      };
    },
    applyPreset(id) {
      const preset = getAllPresets().find((item) => item.id === id);
      if (!preset) throw new Error(`Unknown preset: ${id}`);
      applyPreset(preset);
      DSVisLogger.info('agent', 'preset-applied', { id });
      return this.getPresentationConfig();
    },
    setTextFlow(flow) {
      if (!['horizontal', 'vertical'].includes(flow)) throw new Error(`Invalid textFlow: ${flow}`);
      VIS_CONFIG.textFlow = flow;
      applyVisConfig();
      DSVisLogger.info('agent', 'text-flow-updated', { flow });
      return this.getPresentationConfig();
    },
    setFieldVisibility(fieldKey, state = 'visible') {
      const key = normalizeAgentFieldKey(fieldKey);
      if (!key) throw new Error('fieldKey is required');
      if (!['visible', 'self', 'cascade'].includes(state) && state !== false) {
        throw new Error(`Invalid field visibility: ${state}`);
      }
      setNodeFieldVisible(key, state);
      DSVisLogger.info('agent', 'field-visibility-updated', { key, state });
      return this.getPresentationConfig();
    },
    setTitleField(className, fieldKey = null) {
      if (fieldKey) TITLE_FIELD = { className, key: normalizeAgentFieldKey(fieldKey) };
      else TITLE_FIELD = null;
      try { localStorage.setItem('dsvis:titleField', JSON.stringify(TITLE_FIELD)); } catch (_) {}
      reapplyStep();
      DSVisLogger.info('agent', 'title-field-updated', { titleField: TITLE_FIELD } );
      return this.getPresentationConfig();
    },
    setEdgeProxy(targetKey, rule = null) {
      const key = normalizeAgentFieldKey(targetKey);
      if (!key) throw new Error('targetKey is required');
      if (rule === null) {
        EDGE_PROXY.delete(key);
      } else {
        const proxy = normalizeAgentFieldKey(rule.proxy);
        if (!proxy) throw new Error('rule.proxy is required');

    },
  });

  // ── presentation (10) ──
  dsvis.define('presentation.setTextFlow', {
    description: '设置文本方向（horizontal=横向, vertical=纵向）',
    params: { flow: { type: 'string', description: '"horizontal" 或 "vertical"' } },
    handler(args) {
      if (!['horizontal', 'vertical'].includes(args.flow)) throw new Error('flow 必须为 horizontal 或 vertical');
      VIS_CONFIG.textFlow = args.flow;
      applyVisConfig();
      return `文本方向已设为 ${args.flow}`;
    },
  });
  dsvis.define('presentation.showPanel', {
    description: '显示指定面板（stack=栈面板, code=源代码面板）',
    params: { name: { type: 'string', description: '"stack" 或 "code"' } },
    handler(args) {
      if (args.name === 'stack') { showStackPanel(); return '栈面板已显示'; }
      if (args.name === 'code') { showRightPanel(); return '代码面板已显示'; }
      throw new Error('面板名必须为 stack 或 code');
    },
  });
  dsvis.define('presentation.hidePanel', {
    description: '隐藏指定面板',
    params: { name: { type: 'string', description: '"stack" 或 "code"' } },
    handler(args) {
      if (args.name === 'stack') { hideStackPanel(); return '栈面板已隐藏'; }
      if (args.name === 'code') { hideRightPanel(); return '代码面板已隐藏'; }
      throw new Error('面板名必须为 stack 或 code');
    },
  });
  dsvis.define('presentation.applyPreset', {
    description: '应用预设配置（需要先知道预设ID，可通过 getConfig 查看可用预设）',
    params: { id: { type: 'string', description: '预设标识符' } },
    handler(args) {
      const preset = getAllPresets().find(p => p.id === args.id);
      if (!preset) throw new Error(`未知预设: ${args.id}。可用预设: ${getAllPresets().map(p => p.id).join(', ')}`);
      applyPreset(preset);
      return `已应用预设: ${preset.name || args.id}`;
    },
  });
  dsvis.define('presentation.setFieldVisibility', {
    description: '控制节点字段的可见性（visible=显示, self=仅隐藏自身, cascade=隐藏自身及子节点, false=隐藏）',
    params: {
      fieldKey: { type: 'string', description: '字段标识（如 "TreeNode::val"）' },
      state: { type: 'string', description: '"visible", "self", "cascade", 或 "false"' },
    },
    handler(args) {
      const key = normalizeAgentFieldKey(args.fieldKey);
      if (!key) throw new Error('fieldKey 不能为空');
      const state = args.state;
      if (!['visible', 'self', 'cascade'].includes(state) && state !== 'false') {
        throw new Error('state 必须为 visible/self/cascade/false');
      }
      setNodeFieldVisible(key, state === 'false' ? false : state);
      return `字段 ${key} 可见性已设为 ${state}`;
    },
  });
  dsvis.define('presentation.setTitleField', {
    description: '设置节点标题替换（将节点默认标题替换为指定字段的值）',
    params: {
      className: { type: 'string', description: '节点类名（如 TreeNode）' },
      fieldKey: { type: 'string', description: '用作标题的字段键；传空字符串或 null 可取消替换' },
    },
    handler(args) {
      if (args.fieldKey && args.fieldKey !== 'null') {
        TITLE_FIELD = { className: args.className, key: normalizeAgentFieldKey(args.fieldKey) };
      } else {
        TITLE_FIELD = null;
      }
      try { localStorage.setItem('dsvis:titleField', JSON.stringify(TITLE_FIELD)); } catch (_) {}
      reapplyStep();
      return TITLE_FIELD ? `标题已替换为 ${args.className}::${args.fieldKey}` : '标题替换已取消';
    },
  });
  dsvis.define('presentation.setEdgeProxy', {
    description: '设置边代理规则（让边从指定字段位置发出）。传 null rule 可删除代理',
    params: {
      targetKey: { type: 'string', description: '目标字段键' },
      rule: { type: 'string', description: '代理规则的 JSON 字符串：{"proxy":"键名","ratio":3,"includeEnds":true} 或 "null"' },
    },
    handler(args) {
      const key = normalizeAgentFieldKey(args.targetKey);
      if (!key) throw new Error('targetKey 不能为空');
      const ruleStr = (args.rule || '').trim();
      if (!ruleStr || ruleStr === 'null' || ruleStr === '""') {
        EDGE_PROXY.delete(key);
        reapplyStep();
        return `已删除字段 ${key} 的边代理`;
      }
      let parsed;
      try { parsed = JSON.parse(ruleStr); } catch (_) { throw new Error('rule 必须是有效 JSON'); }
      const proxy = normalizeAgentFieldKey(parsed.proxy);
      if (!proxy) throw new Error('rule.proxy 不能为空');
      const ratio = parsed.ratio === 'auto' ? 'auto' : Math.max(1, parseInt(parsed.ratio, 10) || 1);
      EDGE_PROXY.set(key, { proxy, ratio, includeEnds: parsed.includeEnds !== false });
      reapplyStep();
      return `字段 ${key} 的边代理已设为 → ${proxy}`;
    },
  });
  dsvis.define('presentation.restoreHiddenNode', {
    description: '恢复（取消隐藏）指定节点',
    params: { nodeId: { type: 'string', description: '节点标识符' } },
    handler(args) {
      restoreNode(String(args.nodeId));
      return `节点 ${args.nodeId} 已恢复`;
    },
  });
  dsvis.define('presentation.getConfig', {
    description: '获取当前所有展示配置',
    handler() {
      return {
        textFlow: VIS_CONFIG.textFlow,
        showSubtitle: VIS_CONFIG.showSubtitle,
        visibility: Object.fromEntries(NODE_TYPE_VISIBILITY),
        edgeProxy: Object.fromEntries(EDGE_PROXY),
        titleField: TITLE_FIELD,
        hiddenNodes: Array.from(HIDDEN_NODES.keys()),
        presets: getAllPresets().map(p => ({ id: p.id, name: p.name, builtin: p.builtin })),
      };
    },
  });
  dsvis.define('presentation.resetLayout', {
    description: '重置布局到默认状态',
    handler() { resetGraphInstance(); renderStep(current); return '布局已重置'; },
  });

  // ── Build nested namespace: dsvis.agent.{category}.{name} ──
  dsvis.agent = dsvis.agent || {};
  for (const [name, def] of registry) {
    const parts = name.split('.');
    let obj = dsvis.agent;
    for (let i = 0; i < parts.length - 1; i++) {
      obj[parts[i]] = obj[parts[i]] || {};
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = def.handler;
  }

  DSVisLogger.info('agent', 'registry-ready', { count: registry.size });
})();

// ── Agent initialization ──
syncSettingsPanel();
initializeDsvisAgent();

// ── Capability helper wrappers ──
function showStackPanel() {
  PANEL_STATE.stackVisible = true;
  setPaneVisible('stack', true, '隐藏', '恢复');
}
function hideStackPanel() {
  PANEL_STATE.stackVisible = false;
  setPaneVisible('stack', false, '隐藏', '恢复');
}
function showRightPanel() {
  PANEL_STATE.codeVisible = true;
  setPaneVisible('right', true, '隐藏', '恢复');
}
function hideRightPanel() {
  PANEL_STATE.codeVisible = false;
  setPaneVisible('right', false, '隐藏', '恢复');
}
function stepNext() { jumpToStep(current + 1); }
function stepPrev() { jumpToStep(current - 1); }
function stopPlayPause() { stopAutoRun(); }
function doPlay() { startAutoRun(); }
function doPause() { stopAutoRun(); }
function doRestart() { restartDebugSession(); }

// ── AI Assistant panel handlers ──
document.getElementById('pageAgentPanelClose')?.addEventListener('click', () => {
  document.getElementById('pageAgentPanel').style.display = 'none';
});
document.getElementById('pageAgentSend')?.addEventListener('click', async () => {
  const input = document.getElementById('pageAgentInput');
  const chat = document.getElementById('pageAgentChat');
  const status = document.getElementById('pageAgentStatus');
  const text = input.value.trim();
  if (!text || !chat) return;

  chat.innerHTML += `<div style="color:#0f2c63;margin:2px 0"><b>你:</b> ${text}</div>`;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  const agent = window.__dsvisAgent;

  try {
    if (agent && typeof agent.execute === 'function') {
      status.textContent = 'AI 思考中...';
      const raw = await agent.execute(text);
      // agent.execute returns { success, data, history } — extract the text
      let msg = '';
      if (raw && typeof raw === 'object' && raw.data) {
        msg = String(raw.data);
      } else if (typeof raw === 'string') {
        msg = raw;
      } else {
        msg = JSON.stringify(raw);
      }
      // Escape HTML to prevent injection, then replace newlines with <br>
      var div = document.createElement('div');
      div.textContent = msg;
      var safe = div.innerHTML;
      chat.innerHTML += '<div style="color:#333;margin:2px 0"><b>AI:</b> ' + safe.replace(/\n/g, '<br>') + '</div>';
      status.textContent = '就绪';
    } else {
      chat.innerHTML += `<div style="color:#999;margin:2px 0"><b>系统:</b> Agent 未连接。请在设置面板中启用 AI 助手。若首次使用，请刷新页面。</div>`;
      status.textContent = '未连接';
    }
  } catch (e) {
    chat.innerHTML += `<div style="color:#c00;margin:2px 0"><b>错误:</b> ${e.message}</div>`;
    status.textContent = '出错';
  }
  chat.scrollTop = chat.scrollHeight;
});
document.getElementById('pageAgentInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('pageAgentSend')?.click();
});

/* ========================================================================
 * End Persistence & PageAgent Section
 * ======================================================================== */

// ── Context menu handlers (works for both graph nodes and field items) ──
function hideViaContextMenu(cascade) {
  const menu = document.getElementById('nodeContextMenu');
  if (!menu) return;
  if (menu._fieldKey) {
    setNodeFieldVisible(menu._fieldKey, cascade ? 'cascade' : 'self');
  } else if (menu._nodeId) {
    hideNode(menu._nodeId, menu._nodeLabel, cascade);
  }
  menu.style.display = 'none';
}
document.getElementById('ctxHideSelf')?.addEventListener('click', () => hideViaContextMenu(false));
document.getElementById('ctxHideCascade')?.addEventListener('click', () => hideViaContextMenu(true));

updateResizeHandleState();

// Load persisted config
loadProxy();
loadVisibility();
try {
  const leRaw = localStorage.getItem('dsvis:layerEdges');
  if (leRaw) { LAYER_EDGES = new Set(JSON.parse(leRaw)); }
} catch(_) {}
try {
  const tfRaw = localStorage.getItem('dsvis:titleField');
  if (tfRaw) { TITLE_FIELD = JSON.parse(tfRaw); }
} catch(_) {}

renderAllCode();
computeStepDiffs();
renderStep(0);
</script>
